<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOCout</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Cpath%20d%3D%22M11%2033%20L22%2015%20L31.5%2029%22%20fill%3D%22none%22%20stroke%3D%22%230A6C87%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%2211%22%20cy%3D%2233%22%20r%3D%225%22%20fill%3D%22%230A6C87%22/%3E%3Ccircle%20cx%3D%2222%22%20cy%3D%2215%22%20r%3D%225%22%20fill%3D%22%230A6C87%22/%3E%3Cpath%20d%3D%22M34.0%2023.0L35.4%2028.2L40.0%2025.5L37.3%2030.1L42.5%2031.5L37.3%2032.9L40.0%2037.5L35.4%2034.8L34.0%2040.0L32.6%2034.8L28.0%2037.5L30.7%2032.9L25.5%2031.5L30.7%2030.1L28.0%2025.5L32.6%2028.2Z%22%20fill%3D%22%23E0662B%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: consola de trabajo a pantalla completa — panel de carpetas/inventario | lienzo con rejilla | inspector */
:root{
  --bg:#E8ECF0; --panel:#FFFFFF; --panel-2:#F3F5F7; --ink:#15212C; --muted:#5A6978; --line:#D3DBE2;
  --accent:#0A6C87; --accent-ink:#FFFFFF; --accent-soft:#DDEEF3;
  --hit:#B05F00; --hit-soft:#FBE9CC; --danger:#B4321C; --danger-soft:#F7E1DC;
  --grid:#C6D0D9; --edge:#536373; --demarc:#B3266E; --node:#FFFFFF; --overlay:rgba(14,22,30,.42);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1318; --panel:#151E26; --panel-2:#1B2630; --ink:#E1E8EE; --muted:#8C9AA7; --line:#2A3845;
  --accent:#4BB4D1; --accent-ink:#06222B; --accent-soft:#163743;
  --hit:#F2A33A; --hit-soft:#3B2B13; --danger:#F07560; --danger-soft:#3A1D18;
  --grid:#24323E; --edge:#93A4B3; --demarc:#F06BB0; --node:#18232D; --overlay:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1318; --panel:#151E26; --panel-2:#1B2630; --ink:#E1E8EE; --muted:#8C9AA7; --line:#2A3845;
  --accent:#4BB4D1; --accent-ink:#06222B; --accent-soft:#163743;
  --hit:#F2A33A; --hit-soft:#3B2B13; --danger:#F07560; --danger-soft:#3A1D18;
  --grid:#24323E; --edge:#93A4B3; --demarc:#F06BB0; --node:#18232D; --overlay:rgba(0,0,0,.55); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);overflow:hidden}
[hidden]{display:none!important}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-columns:290px 10px minmax(0,1fr) 10px 300px;grid-template-rows:auto minmax(0,1fr);gap:10px 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:9px;font:600 17px/1 var(--f-cond);letter-spacing:.01em;white-space:nowrap}
.brand svg{color:var(--accent)}
.search{position:relative;flex:1 1 260px;min-width:0;max-width:520px}
.search input{width:100%;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 12px 0 34px}
.search>svg{position:absolute;left:11px;top:10px;color:var(--muted)}
.sres{position:absolute;top:40px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:30;max-height:60vh;overflow:auto;padding:4px}
.sres button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;border:0;background:none;padding:7px 9px;border-radius:5px;cursor:pointer}
.sres button:hover,.sres button.on{background:var(--panel-2)}
.sres .k{font:500 10.5px/1 var(--f-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:58px;flex:none}
.sres .sub{color:var(--muted);font-size:12px;margin-left:auto;font-family:var(--f-mono)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.status.warn i{background:var(--hit)}
.acts{display:flex;gap:6px;margin-left:auto}

.btn{height:34px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.dan{color:var(--danger);border-color:var(--danger)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn.ic{width:34px;padding:0;justify-content:center}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--panel-2)}
.btn[disabled]{opacity:.45;cursor:default}
.menuBtn{display:none}

.rz{cursor:col-resize;position:relative;touch-action:none;min-height:0}
.rz::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;border-radius:2px;background:transparent;transition:background .15s}
.rz:hover::after,.rz.on::after{background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
body.hideL .side,body.hideL #rzL,body.hideR .insp,body.hideR #rzR{display:none}
.panTog{width:30px;padding:0;justify-content:center}
.panTog.off{color:var(--muted)}
.side,.insp,.stage{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;min-width:0}
.side{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;border:0;background:none;padding:11px 2px 9px;cursor:pointer;color:var(--muted);font:500 12.5px var(--f-ui);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.pane{flex:1;overflow:auto;padding:10px}
.paneHead{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.paneHead .grow{flex:1}
.lbl{font:500 10.5px/1.2 var(--f-ui);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.note{background:var(--hit-soft);border-radius:6px;padding:9px 10px;font-size:12.5px;margin-bottom:10px;display:grid;gap:6px}
.note b{font-weight:600}

/* árbol */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{padding-left:14px;border-left:1px solid var(--line);margin-left:9px}
.tree>li,.mtree>li{background:color-mix(in srgb,var(--cc,var(--accent)) 6%,transparent);border:1px solid color-mix(in srgb,var(--cc,var(--accent)) 20%,transparent);border-left:3px solid var(--cc,var(--accent));border-radius:8px;padding:3px 4px 5px;margin-bottom:7px}
.tree>li>.row,.mtree>li>.mrow{background:color-mix(in srgb,var(--cc,var(--accent)) 15%,transparent);font-weight:600}
.tree>li>.row.on{background:var(--accent-soft)}
.row{position:relative;display:flex;align-items:center;gap:4px;border-radius:5px;padding:3px 4px;cursor:pointer;min-width:0;min-height:28px;box-sizing:border-box}
.row:hover{background:var(--panel-2)}
.row.on{background:var(--accent-soft)}
.row .car{width:18px;height:18px;border:0;background:none;padding:0;cursor:pointer;color:var(--muted);flex:none;display:grid;place-items:center}
.row .car.none{visibility:hidden}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{font:500 9.5px/1 var(--f-mono);text-transform:uppercase;padding:3px 4px;border-radius:3px;border:1px solid var(--line);color:var(--muted);flex:none}
.kind.cliente{color:var(--accent);border-color:var(--accent)}
.row .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;opacity:.75}
.row .ra{display:none;gap:1px;position:absolute;right:3px;top:50%;transform:translateY(-50%);background:var(--panel-2);border-radius:5px;padding:0 1px;box-shadow:-8px 0 8px -4px var(--panel-2)}
.row.on .ra{background:var(--accent-soft);box-shadow:-8px 0 8px -4px var(--accent-soft)}
.row .cmpk{margin:0 2px 0 0;flex:none;cursor:pointer}
.treeTools{display:flex;gap:6px;align-items:center;margin:-2px 0 8px}
.treeTools .btn{display:inline-flex;align-items:center;gap:5px}
.cmpBar{display:grid;gap:6px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12.5px}
.cmpBar .bb{display:flex;gap:6px;flex-wrap:wrap}
.row:hover .ra,.row.on .ra{display:flex}
.ra button{width:22px;height:22px;padding:0;display:inline-grid;place-items:center;border:0;background:none;border-radius:4px;cursor:pointer;color:var(--muted)}
.ra button:hover{background:var(--panel);color:var(--ink)}
.row[draggable=true]{-webkit-user-drag:element}
.row.dragging{opacity:.45}
.row.dropin{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.dropRoot{margin-top:8px;border:2px dashed var(--line);border-radius:6px;padding:10px;text-align:center;font-size:12px;color:var(--muted)}
.dropRoot.dropin{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.row.hit .nm{color:var(--hit);font-weight:500}

/* inventario */
.dlist{display:grid;gap:2px}
.drow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px;border-radius:5px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.drow:hover{background:var(--panel-2)}
.drow .t{min-width:0}
.drow .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .ip{font:12px var(--f-mono);color:var(--muted)}
.drow .use{font:11px var(--f-mono);color:var(--muted)}
.drow svg{color:var(--accent)}
.fld{display:grid;gap:4px;margin-bottom:10px}
.fld input,.fld select,.fld textarea,.inp{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;min-width:0}
.fld textarea{resize:vertical;min-height:70px}

/* impacto */
.imp{display:grid;gap:10px}
.sum{display:flex;gap:16px;padding:10px;background:var(--hit-soft);border-radius:6px}
.sum div{display:grid}
.sum b{font:600 22px/1.1 var(--f-cond);color:var(--hit)}
.sum span{font-size:11.5px;color:var(--muted)}
.grp{display:grid;gap:3px}
.grp h4{margin:6px 0 2px;font:600 13px var(--f-ui)}
.irow{border:0;background:none;text-align:left;padding:6px 8px;border-radius:5px;cursor:pointer;display:grid;gap:2px;width:100%;border-left:2px solid var(--hit)}
.irow:hover{background:var(--panel-2)}
.irow .p{font-size:12px;color:var(--muted)}
.irow .pp{font:11.5px var(--f-mono);color:var(--hit)}

/* lienzo */
.stage{position:relative;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;font-size:13px;color:var(--muted)}
.crumb b{color:var(--ink);font:600 15px var(--f-cond);overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.canvasWrap{position:relative;flex:1;min-height:0}
.inEd{position:fixed;z-index:70;resize:none;overflow:hidden;border:1.5px solid var(--accent);border-radius:5px;background:var(--panel);color:var(--ink);font-family:var(--f-ui);padding:1px 4px;box-shadow:0 4px 14px rgba(0,0,0,.15);outline:none;white-space:pre}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block;background:var(--panel-2)}
#cv.panning{cursor:grabbing}
.hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;pointer-events:none;max-width:calc(100% - 190px)}
.banners{position:absolute;left:10px;top:10px;right:10px;display:grid;gap:6px;pointer-events:none}
.banners>*{pointer-events:auto}
.incBanner{display:flex;gap:10px;align-items:center;background:var(--danger-soft);border:1px solid var(--danger);border-radius:6px;padding:6px 8px 6px 12px;font-size:13px;flex-wrap:wrap}
.incBanner b{color:var(--danger)}
.incBanner .grow{flex:1}
.medPick{display:flex;gap:6px;flex-wrap:wrap}
.medPick button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 6px;cursor:pointer;color:var(--edge);display:grid;place-items:center}
.medPick button svg line{stroke:currentColor;stroke-width:2.2}.medPick button svg circle{fill:currentColor}
.medPick button:hover{border-color:var(--accent)}
.medPick button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pedit{cursor:text}.pedit rect{fill:var(--panel);stroke:var(--accent);stroke-width:1.2;stroke-dasharray:3 2}.pedit text{fill:var(--accent);font:600 10.5px var(--f-mono);text-anchor:middle;pointer-events:none}
.pedit.has rect{fill:transparent}
.impMini{position:absolute;z-index:6;top:64px;right:12px;background:var(--hit-soft);border:1px solid var(--hit);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.impMini b{color:var(--hit)}
.node.svcFocus .nb{stroke:var(--accent)!important;stroke-width:3!important}
.impCard{position:absolute;z-index:6;width:250px;flex-direction:column;align-items:stretch!important;gap:8px!important;padding:10px 12px!important;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.impCard::before{content:"";position:absolute;left:-7px;top:18px;width:12px;height:12px;background:var(--hit-soft);border-left:1px solid var(--hit);border-bottom:1px solid var(--hit);transform:rotate(45deg)}
.impCard.left::before{left:auto;right:-7px;border-left:0;border-bottom:0;border-right:1px solid var(--hit);border-top:1px solid var(--hit)}
.impCard.free::before{display:none}
.impCard .row2{display:grid;gap:6px}
.impCard .row2 .btn{justify-content:center;width:100%}
.impCard .big{font:600 22px/1 var(--f-cond);color:var(--hit)}
.impBanner{display:flex;gap:10px;align-items:center;background:var(--hit-soft);border:1px solid var(--hit);border-radius:6px;padding:6px 8px 6px 12px;font-size:13px;flex-wrap:wrap}
.impBanner b{color:var(--hit)}
.impBanner .grow{flex:1}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:20px}
.empty div{max-width:340px;text-align:center;color:var(--muted);display:grid;gap:8px}
.empty h3{margin:0;color:var(--ink);font:600 18px var(--f-cond)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;align-items:flex-end;gap:6px}
.zoom .zcol{display:flex;flex-direction:column;gap:4px}
.zoom #tFit{background:var(--panel)}

/* svg */
.node .nb{fill:var(--node);stroke:var(--line);stroke-width:1.2}
.node .nm{font:600 13px var(--f-cond);fill:var(--ink)}
.node .ipt{font:11px var(--f-mono);fill:var(--muted)}
.node .gl{color:var(--accent)}
.node .hd{fill:var(--panel);stroke:var(--accent);stroke-width:1.5;cursor:crosshair;opacity:.0;transition:opacity .12s}
.node:hover .hd,.node.sel .hd{opacity:1}
@media (hover:none){.node .hd{opacity:.9}}
.node .plus{cursor:pointer;opacity:0;transition:opacity .12s}
.node .plus circle{fill:var(--accent)}
.node .plus path{stroke:var(--accent-ink);stroke-width:1.8;stroke-linecap:round}
.node:hover .plus,.node.sel .plus{opacity:1}
@media (hover:none){.node.sel .plus{opacity:1}}
.eend{fill:var(--panel);stroke:var(--accent);stroke-width:2;cursor:grab}
.eend:hover{fill:var(--accent)}
.plusMenu{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:4px;display:grid;min-width:190px}
.plusMenu button{display:flex;gap:8px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:5px;cursor:pointer;text-align:left}
.plusMenu button:hover{background:var(--panel-2)}
.plusMenu small{color:var(--muted);display:block;font-size:11.5px}
.pick .create{grid-template-columns:22px 1fr;color:var(--accent);font-weight:500}
.pchips{display:flex;flex-wrap:wrap;gap:4px;max-height:96px;overflow:auto}
.pchip{font:11.5px var(--f-mono);padding:3px 7px;border-radius:4px;background:var(--panel);border:1px solid var(--line);cursor:pointer;color:var(--ink)}
.pchip:hover{border-color:var(--accent)}
.pchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pchip.used{border-color:var(--accent);color:var(--accent)}
.portBox{background:var(--panel-2);border-radius:8px;padding:10px;display:grid;gap:8px}
.portBox .head{display:flex;align-items:center;gap:6px}
.portBox .head b{font:600 13px var(--f-cond);flex:1}
.portAdd{display:flex;gap:6px}
.portAdd input{flex:1;min-width:0}
.endHint{font-size:11px;color:var(--muted)}
.endSel{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 6px;font:600 13px var(--f-cond)}
.node{cursor:move}
.node.sel .nb{stroke:var(--accent);stroke-width:2}
.node.hit .nb{stroke:var(--hit);stroke-width:2.5;fill:var(--hit-soft)}
.node.dim{opacity:.38}
.node.txt .tb{fill:transparent;stroke:transparent}
.node.txt.sel .tb{stroke:var(--accent);stroke-dasharray:4 3}
.node.txt text{font:13px var(--f-ui);fill:var(--ink)}
.edge line.ln{stroke:var(--edge);stroke-width:1.8;fill:none}
.edge.sel line.ln{stroke:var(--accent);stroke-width:2.6}
.edge.hit line.ln{stroke:var(--hit);stroke-width:3}
.edge.dim{opacity:.3}
.edge .eh{stroke:transparent;stroke-width:14;cursor:pointer}
.pl rect{fill:var(--panel);stroke:var(--line)}
.pl text{font:10.5px var(--f-mono);fill:var(--ink)}
.edge.hit .pl rect{stroke:var(--hit);fill:var(--hit-soft)}
.edge.sel .pl rect{stroke:var(--accent)}
.ml text{font:italic 11px var(--f-ui);fill:var(--muted)}
.tmp{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;pointer-events:none}

/* inspector */
.insp{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.insp h3{margin:0;font:600 17px/1.2 var(--f-cond);overflow-wrap:anywhere}
.insp .sub{color:var(--muted);font-size:12.5px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.acc{display:grid;gap:6px}
.accRow{display:grid;grid-template-columns:46px minmax(0,1fr) auto auto;gap:6px;align-items:center;background:var(--panel-2);border-radius:6px;padding:5px 6px}
.accRow .pr{font:500 10.5px var(--f-mono);text-transform:uppercase;color:var(--accent)}
.accRow code{font:12px var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accRow a{font-size:12px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:11.5px var(--f-mono);padding:2px 6px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);cursor:pointer}
.chip:hover{border-color:var(--hit);color:var(--hit)}
.sep{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.ends{display:grid;gap:8px}
.end{display:grid;gap:4px;padding:8px;border-radius:6px;background:var(--panel-2)}
.end .who{font:600 13px var(--f-cond)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.insClose{display:none}

/* modal y toast */
.modal{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:50;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.mbox{background:var(--panel);border-radius:10px;width:min(560px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);min-width:0}
.mbox header{padding:16px 18px 4px;font:600 18px var(--f-cond)}
.mbox .mb{padding:10px 18px;overflow:auto;min-width:0;min-height:0;flex:1 1 auto}
.mbox header{flex:none}
.mbox footer{flex:none;border-top:1px solid var(--line);padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mbox p{margin:0 0 10px}
.chk{display:flex;gap:8px;align-items:center}
.accEdit{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.accEdit input[type=text]{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px}
.pick{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:6px;margin-top:8px}
.pick button{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:8px;cursor:pointer}
.pick button:hover{background:var(--panel-2)}
.pick button[disabled]{opacity:.5}
.pick svg{color:var(--accent)}
pre.code{background:var(--panel-2);border-radius:6px;padding:9px;font:12px var(--f-mono);overflow:auto;white-space:pre;margin:0 0 10px}
textarea.big{width:100%;min-height:200px;font:12px var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--panel-2)}
.choice{display:grid;gap:8px}
.choice button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px;cursor:pointer;display:grid;gap:2px}
.choice button:hover{border-color:var(--accent)}
.choice b{font-weight:600}
.choice span{color:var(--muted);font-size:12.5px}
.err{color:var(--danger);font-size:12.5px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:6px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
.scrim{display:none}


/* tipos de equipo */
.ticon{flex:none;object-fit:contain;display:block}
.trows{display:grid}
.trow{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.trow .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.trow .tc{font:12px var(--f-mono);color:var(--muted)}
.tbox{width:34px;height:34px;border-radius:7px;background:var(--panel-2);display:grid;place-items:center}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.igrid button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 2px 6px;display:grid;justify-items:center;gap:5px;font-size:10.5px;color:var(--muted);cursor:pointer}
.igrid button svg{color:var(--ink)}
.igrid button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.sw{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.sw input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:2px;cursor:pointer}
.imgRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.imgPrev{width:56px;height:56px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;background:var(--panel-2)}
.imgPrev img{max-width:48px;max-height:48px}
.tprev{display:flex;justify-content:center;padding:12px;background:var(--panel-2);border-radius:8px;margin-bottom:12px}
.tprev svg{max-width:100%}


/* incidencias */
.tabs .cnt{display:inline-block;min-width:16px;padding:0 4px;margin-left:3px;border-radius:8px;background:var(--danger);color:var(--panel);font:600 10px/16px var(--f-ui)}
.layerSel{height:28px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 6px;font-size:12.5px}
.node.inc .nb{stroke:var(--danger);stroke-width:2.4}
.node.inc.hit .nb{stroke:var(--hit)}
.edge.inc line.ln{stroke:var(--danger);stroke-width:2.6}
.edge.inc.hit line.ln{stroke:var(--hit)}
.edge.inc .pl rect{stroke:var(--danger)}
.ibadge circle{fill:var(--danger)}
.ibadge text{font:700 11px var(--f-ui);fill:#fff}
.node.inc .halo{fill:none;stroke:var(--danger);stroke-opacity:.35;stroke-width:6}
@media (prefers-reduced-motion:no-preference){.node.inc.act .halo{animation:pulse 1.8s ease-in-out infinite}}
@keyframes pulse{50%{stroke-opacity:.08}}
.row .incdot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none}
.ilist{display:grid;gap:6px}
.icard{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:9px 10px;text-align:left;cursor:pointer;display:grid;gap:3px;width:100%}
.icard:hover{border-color:var(--muted)}
.icard.act{border-color:var(--danger);background:var(--danger-soft)}
.icard .ih{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
.icard b{font-weight:600;overflow-wrap:anywhere}
.icard .it{font:12px var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.icard .ia{font-size:12px}
.sev{font:600 10px/1 var(--f-ui);text-transform:uppercase;letter-spacing:.05em;padding:3px 5px;border-radius:3px;border:1px solid currentColor}
.sev.critica{color:var(--danger)} .sev.mayor{color:var(--hit)} .sev.menor{color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;border:0;background:var(--panel);padding:5px 8px;white-space:nowrap;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--ink);font-weight:500}
.rank{display:grid;gap:3px}
.rank button{display:grid;grid-template-columns:minmax(0,1fr) 90px 26px;gap:8px;align-items:center;border:0;background:none;padding:5px 4px;border-radius:5px;cursor:pointer;text-align:left;width:100%}
.rank button:hover{background:var(--panel-2)}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.rank .bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--danger)}
.rank .n{font:12px var(--f-mono);text-align:right}
.scope{display:grid;gap:6px}
.scRow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 30px;gap:6px}
.scRow select{min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px}
.affect{background:var(--panel-2);border-radius:6px;padding:8px 10px;font-size:12.5px;display:grid;gap:3px;max-height:150px;overflow:auto}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.three,.two{grid-template-columns:1fr}}


/* secciones, demarcación y grupos */
.secs{display:inline-flex;gap:3px;flex-wrap:wrap}
.sec{font:600 10px/1 var(--f-ui);padding:3px 5px;border-radius:3px;color:#fff}
.drow .secs{margin-left:4px;vertical-align:1px}
.spill text{font:700 8.5px var(--f-ui);fill:#fff}
.node.sdim{opacity:.22}
.edge.sdim{opacity:.18}
.dm line{stroke:var(--demarc);stroke-width:3.2;stroke-linecap:round}
.dm text{font:600 10px var(--f-ui);fill:var(--demarc);paint-order:stroke;stroke:var(--panel-2);stroke-width:3px}
.dm text.sd{font:italic 500 9.5px var(--f-ui)}
.geo{pointer-events:none}
.geo path{stroke:var(--geo-st,#8fa3b5);stroke-width:1.2;fill:var(--geo-us,#e9f0f7)}
.geo path.geo-mx{fill:var(--geo-mx,#edf3e6)}
.geo text{fill:var(--geo-tx,#7d8d9c);text-anchor:middle;font-family:var(--f-ui);font-weight:600;letter-spacing:.04em;opacity:.8}
[data-theme="dark"] .geo path{--geo-us:#1d2733;--geo-mx:#1f2a22;--geo-st:#3b4b5c}[data-theme="dark"] .geo text{--geo-tx:#5f7184}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .geo path{--geo-us:#1d2733;--geo-mx:#1f2a22;--geo-st:#3b4b5c}:root:not([data-theme="light"]) .geo text{--geo-tx:#5f7184}}
.grp .gb{fill-opacity:.05;stroke-width:1.5;pointer-events:none}
.grp .gh{fill:transparent;cursor:move}
.grp .gt{font:600 11px var(--f-cond);letter-spacing:.04em;pointer-events:none}
.grp .gt tspan.k{text-transform:uppercase;font:600 9.5px var(--f-ui);letter-spacing:.08em}
.grp .gr{fill:var(--panel);stroke:var(--accent);stroke-width:1.5;cursor:nwse-resize;opacity:0}
.grp:hover .gr,.grp.sel .gr{opacity:1}
.grp.sel .gb{stroke-width:2.5}
.grp.auto .gb{fill-opacity:.025;stroke-opacity:.75}
.grp.inc .gb{stroke:var(--danger)!important;stroke-width:2.5}
.marquee{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-dasharray:4 3}
.chkrow{display:flex;gap:14px;flex-wrap:wrap}
.fld input[type=checkbox]{width:auto;padding:0}
.fld input[type=range]{padding:0;border:0;background:none}
.crumb{flex:1 1 200px}
.secSel{max-width:150px}


/* formas de nodo y herramientas del panel */
.node .nm.sm{font-size:12px}
.node.sh-ring .nb{stroke:var(--edge);stroke-width:2}
.node .rdot{fill:var(--node);stroke:var(--accent);stroke-width:1.6}
.node.el .nb{stroke-dasharray:5 3}
.node.sh-icon .nb{fill:transparent;stroke:transparent}
.node.sh-icon.sel .nb{stroke:var(--accent);stroke-dasharray:4 3}
.node.sh-icon.hit .nb{stroke:var(--hit)}
.node.sh-icon.inc .nb{stroke:var(--danger)}
.shgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.shgrid button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 2px 5px;display:grid;justify-items:center;gap:3px;font-size:10.5px;color:var(--muted);cursor:pointer}
.shgrid button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.shgrid .mo{fill:var(--panel-2);stroke:currentColor;stroke-width:4}
.inspTools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.inspTools .btn{justify-content:center}
#inspBody{display:flex;flex-direction:column;gap:12px;min-width:0}
.mOnly{display:none}

/* mapa general */
.mtree,.mtree ul{list-style:none;margin:0;padding:0}
.mtree ul{padding-left:16px}
.mrow{display:flex;align-items:center;gap:7px;padding:3px 2px;border-radius:5px;cursor:pointer;font-size:13px;min-width:0}
.mrow:hover{background:var(--panel-2)}
.mrow input{flex:none;margin:0;accent-color:var(--accent)}
.mrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .dotc{width:10px;height:10px;border-radius:3px;flex:none}
.mrow .open{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 4px}
.mrow .open:hover{color:var(--accent)}
.shareDet summary{cursor:pointer;font-size:13px;padding:4px 2px;list-style-position:inside}
.shareDet summary b{color:var(--accent)}
.shareBox{background:var(--accent-soft);border-radius:8px;padding:10px;display:grid;gap:6px;font-size:13px}
.shareBox b.big{font:600 22px/1 var(--f-cond);color:var(--accent)}
.shareBox.none{background:var(--panel-2)}
.srow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;border:0;background:none;padding:5px 4px;border-radius:5px;cursor:pointer;text-align:left;width:100%}
.srow:hover{background:var(--panel)}
.srow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .c{font:600 11px var(--f-mono);color:var(--accent)}
.svcs{display:flex;flex-wrap:wrap;gap:4px}
.svc{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 7px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);cursor:pointer;color:var(--ink)}
.svc i{width:8px;height:8px;border-radius:2px;display:inline-block}
.edge.shared line.ln{stroke-width:3.6}
.node.shared .nb{stroke:var(--accent);stroke-width:2.6}
.sbadge circle{fill:var(--accent)}
.sbadge text{font:700 10.5px var(--f-ui);fill:var(--accent-ink)}
.mapNote{font-size:12px;color:var(--muted)}
body.mapMode .stage{border-color:var(--accent)}
/* ubicaciones */
.mbox.wide{width:min(920px,100%)}
.locTools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.locTools .inp{flex:1;min-width:160px}
.loc{border:1.5px solid var(--lc,var(--line));border-radius:9px;padding:9px 10px 10px;display:grid;gap:8px;background:color-mix(in srgb,var(--lc,var(--line)) 5%,var(--panel));min-width:0}
.loc.rack,.loc.gabinete{border-radius:5px}
.loc.piso,.loc.sala{border-style:dashed}
.loc.gabinete{border-style:dotted;border-width:2px}
.loc.focus{box-shadow:0 0 0 3px var(--accent-soft)}
.lh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lh .k{font:600 10px var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--lc,var(--muted))}
.lh b{font:600 15px var(--f-cond)}
.lh .cnt{font-size:12px;color:var(--muted);margin-left:auto}
.ldevs{display:flex;flex-wrap:wrap;gap:6px}
.ldev{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 8px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.ldev:hover{border-color:var(--accent)}
.ldev.me{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ldev.me svg{color:var(--accent-ink)!important}
.ldev small{font:11px var(--f-mono);opacity:.75}
.lkids{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.lsvc{display:flex;flex-wrap:wrap;gap:4px}
.lsvc .svc{font-size:11px;padding:2px 6px}
.locWarn{background:var(--hit-soft);border:1px solid var(--hit);border-radius:6px;padding:8px 10px;font-size:12.5px;margin-bottom:10px}
.locList{display:grid;gap:10px}
.pillTog.off{opacity:.5;text-decoration:line-through}
.pillTog.part{border-style:dashed}
.locPop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 12px;display:grid;gap:4px;min-width:210px;font-size:13px}
.locPop .lph{font:600 11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.locPop label{display:flex;align-items:center;gap:8px;padding:3px 2px;cursor:pointer;border-radius:5px}
.locPop label:hover{background:var(--accent-soft)}
.locPop label i{width:16px;height:0;border-top:2px solid var(--muted);display:inline-block}
.locPop .lpb{display:flex;gap:6px;margin-top:6px}
/* vistas de tarjetas */
.viewSeg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.viewSeg button{border:0;background:none;padding:0 12px;height:34px;cursor:pointer;color:var(--muted);font:500 13px var(--f-ui);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.viewSeg button+button{border-left:1px solid var(--line)}
.viewSeg button.on{background:var(--accent);color:var(--accent-ink)}
body.viewCards .side,body.viewCards .insp,body.viewCards .stage,body.viewCards .rz{display:none!important}
.cardsView{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;min-height:0;padding:18px 20px 28px}
.cvHead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.cvHead h2{margin:0;font:600 22px var(--f-cond);flex:none}
.cvHead .grow{flex:1}
.cvHead .inp{max-width:300px}
.cvSec{margin:18px 0 8px;display:flex;align-items:center;gap:8px;font:600 15px var(--f-cond)}
.cvSec i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cvSec .n{font:500 12px var(--f-ui);color:var(--muted)}
.dtWrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-height:calc(100vh - 210px)}
.dtab{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;min-width:1250px}
.dtab th{position:sticky;top:0;z-index:2;background:var(--panel-2,var(--bg));text-align:left;font:600 11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.dtab th.nos{cursor:default}
.dtab th .ar{color:var(--accent)}
.dtab td{border-bottom:1px solid var(--line);padding:2px 3px;vertical-align:middle}
.dtab tr:hover td{background:var(--accent-soft)}
.dtab td.first{position:sticky;left:0;background:var(--panel);z-index:1}
.dtab tr:hover td.first{background:var(--accent-soft)}
.dtab input.c,.dtab select.c,.dtab textarea.c{width:100%;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;padding:5px 6px;border-radius:5px;min-width:0}
.dtab textarea.c{resize:vertical;min-height:30px;height:30px;font-size:12.5px}
.dtab .c:hover{border-color:var(--line)}
.dtab .c:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.dtab .c.mono{font-family:var(--f-mono);font-size:12.5px}
.dtab .c.bad{border-color:var(--danger)}
.dtab .secs{display:flex;gap:3px;flex-wrap:nowrap;min-width:78px}
.dtab .secs button{border:1px solid var(--line);background:transparent;color:var(--muted);font:600 10.5px var(--f-ui);border-radius:4px;padding:3px 5px;cursor:pointer}
.dtab .secs button.on{color:#fff;border-color:transparent}
.dtab .plc{display:flex;align-items:center;gap:4px;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;font-size:12.5px;text-align:left;padding:5px 6px;border-radius:5px;cursor:pointer;width:100%}
.dtab .plc:hover{border-color:var(--line)}
.dtab .plc.none{color:var(--muted)}
.dtab .ico{display:flex;gap:2px;justify-content:flex-end}
.dtab .ico button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:4px;font-size:13px}
.dtab .ico button:hover{background:var(--line);color:var(--ink)}
.dtab .num{color:var(--muted);text-align:center;font-family:var(--f-mono);font-size:12px}
.dtFoot{display:flex;gap:10px;align-items:center;margin-top:10px;color:var(--muted);font-size:12.5px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.cgrid.cli{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.cgrid.cli .ccard{padding:20px 16px 16px;gap:8px}
.cgrid.cli .ccard .cimg{width:84px;height:84px;border-radius:18px}
.cgrid.cli .ccard .cimg img{width:68px;height:68px}
.cgrid.cli .ccard .cname{font:600 var(--cli-fs,22px)/1.15 var(--f-cond);color:var(--cli-col,var(--ink))}
.csel{position:absolute;top:8px;left:8px;z-index:2;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:var(--panel);border:1px solid var(--line);cursor:pointer;opacity:.0;transition:opacity .12s}
.ccard:hover .csel,.ccard.picked .csel,body.dsel-on .csel{opacity:1}
.csel input{margin:0;cursor:pointer}
.ccard.picked{outline:2px solid var(--accent);outline-offset:-1px}
.dselBar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13.5px}
.mgTab{width:100%;border-collapse:collapse;font-size:13px}
.mgTab th{text-align:left;font:600 11px var(--f-ui);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.mgTab td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.mgTab select{width:100%}
.mgKeep{display:grid;gap:6px;margin-bottom:12px}
.mgKeep label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.mgKeep label.on{border-color:var(--accent);background:var(--accent-soft)}
.ccard{position:relative;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--cc,var(--accent)) 7%,var(--panel));padding:16px 14px 14px;cursor:pointer;display:grid;gap:6px;text-align:left;min-width:0;overflow:hidden;transition:transform .12s,box-shadow .12s}
.ccard::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--cc,var(--accent))}
.ccard:hover{box-shadow:0 6px 20px rgba(0,0,0,.1);transform:translateY(-1px)}
.ccard:focus-visible{outline:2px solid var(--accent)}
.ccard .cimg{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc,var(--accent)) 16%,var(--panel));color:var(--cc,var(--accent))}
.ccard .cimg img{width:40px;height:40px;object-fit:contain}
.ccard .cname{font:600 16px/1.2 var(--f-cond);overflow-wrap:anywhere}
.ccard .cmeta{font-size:12.5px;color:var(--muted)}
.ccard .cip{font:12px var(--f-mono);color:var(--muted)}
.ccard .cinc{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:600;color:var(--danger);background:var(--danger-soft);border-radius:5px;padding:3px 7px;justify-self:start}
.ccard .cedit{position:absolute;top:12px;right:10px;width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .12s;color:var(--muted)}
.ccard:hover .cedit,.ccard:focus-within .cedit{opacity:1}
@media (hover:none){.ccard .cedit{opacity:1}}
.ccard.inc{border-color:var(--danger)}
.ccard.vip{border:2px solid #D9A400;box-shadow:0 0 0 3px color-mix(in srgb,#D9A400 22%,transparent)}
.ccard.vip::before{background:linear-gradient(90deg,#D9A400,#F3C94B)}
.vipTag{position:absolute;top:14px;right:84px;font:700 11px/1 var(--f-ui);letter-spacing:.05em;color:#6B4E00;background:#FBE39A;border-radius:4px;padding:4px 7px}
.vipBtn{position:absolute;top:12px;right:46px;width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--muted);font-size:16px;line-height:1;opacity:0;transition:opacity .12s}
.ccard:hover .vipBtn,.ccard:focus-within .vipBtn,.vipBtn.on{opacity:1}
.vipBtn.on{color:#C99700;border-color:#D9A400}
@media (hover:none){.vipBtn{opacity:1}}
.cpHead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px;border-radius:12px;background:color-mix(in srgb,var(--cc,var(--accent)) 9%,var(--panel));border:1px solid var(--line);border-top:5px solid var(--cc,var(--accent));margin-bottom:16px}
.cpHead .cimg{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;background:var(--panel);color:var(--cc,var(--accent))}
.cpHead .cimg img{width:46px;height:46px;object-fit:contain}
.cpHead h2{margin:0;font:600 calc(var(--cli-fs,22px) + 2px) var(--f-cond);color:var(--cli-col,var(--ink))}
.cpHead .grow{flex:1;min-width:160px}
.sitegrid{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:44px 64px}
.sitebox{border:1px solid var(--line);border-radius:10px;background:var(--panel);display:grid;align-content:start;overflow:hidden}
.sitebox .sh{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.sitebox .sh b{font:600 var(--site-fs,15px) var(--f-cond);color:var(--site-col,var(--ink));flex:1;min-width:0;overflow-wrap:anywhere}
.svrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.svrow:last-child{border-bottom:0}
.svrow:hover{background:var(--accent-soft)}
.svrow .t{font-weight:500;overflow-wrap:anywhere;font-size:var(--svc-fs,14px);color:var(--svc-col,var(--ink))}
.svrow.l2l{box-shadow:inset 4px 0 0 #E2A400;background:color-mix(in srgb,#E2A400 7%,var(--panel))}
.l2ltag{display:inline-block;font:700 10px/1 var(--f-ui);letter-spacing:.06em;color:#7A5800;background:#FBE7A6;border-radius:3px;padding:3px 5px;margin-right:4px;vertical-align:1px}
.l2lsvg{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2}
.l2lsvg path{fill:none;stroke:#E2A400;stroke-width:3;stroke-linecap:round}
.l2lsvg circle{fill:#E2A400;stroke:var(--panel);stroke-width:2}
.tsRow{display:grid;grid-template-columns:110px minmax(0,1fr) 56px;gap:10px;align-items:center;margin-bottom:6px}
.tsRow input[type=range]{width:100%}
.svrow .m{font-size:12px;color:var(--muted);grid-column:1}
.svrow{position:relative}
.plist{display:grid;gap:4px;max-height:220px;overflow:auto;margin-top:6px}
.pitem{display:grid;gap:1px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;cursor:pointer;color:var(--ink)}
.pitem span{font-size:11.5px;color:var(--muted)}
.pitem:hover{border-color:var(--accent)}
.pitem.on{border-color:var(--accent);background:var(--accent-soft)}
.pnew{display:grid;gap:6px;border:1px dashed var(--accent);border-radius:6px;padding:8px;font-size:12.5px}
.pathBox,.locBox{background:var(--panel-2);border-radius:8px;padding:10px;display:grid;gap:6px}
.locBox .head{display:flex;align-items:center;gap:6px}.locBox .head b{flex:1;font:600 13px var(--f-cond)}
.prow,.lrow{display:flex;gap:8px;align-items:baseline;font-size:13px}
.prow .k,.lrow .k{font:600 10px var(--f-ui);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);min-width:64px}
.lrows{display:grid;gap:3px;border-left:2px solid var(--accent);padding-left:8px}
.pathTxt{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.locBox.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.pick button.on{background:var(--accent-soft)}
.sugBox{display:grid;gap:6px;background:var(--panel-2);border-radius:8px;padding:10px}
.sugG{display:grid;gap:3px}
.sugT{font:600 10.5px var(--f-ui);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.sugI{display:flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 7px;cursor:pointer;text-align:left;font-size:12.5px;width:100%;color:var(--ink)}
.sugI:hover{border-color:var(--accent);background:var(--accent-soft)}
.pick .pgH{padding:7px 9px 3px;font:600 10.5px var(--f-ui);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--panel-2);border-bottom:1px solid var(--line)}
.pick .sugBox{border-radius:0;padding:0;gap:0;background:none}
.pick .sugBox>.lbl{padding:8px 9px;background:var(--accent-soft);color:var(--ink)}
.pick .sugT{padding:6px 9px 2px;margin:0}
.sdevs{padding:10px 12px;border-top:1px dashed var(--line);display:grid;gap:6px;background:color-mix(in srgb,var(--panel-2) 60%,var(--panel))}
.sdevs .hd2{display:flex;align-items:center;gap:6px}
.sdevs .hd2 .lbl{flex:1}
.sdev{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 6px 5px 8px;font-size:12.5px;cursor:pointer;color:var(--ink);max-width:100%}
.sdev:hover{border-color:var(--accent);background:var(--accent-soft)}
.sdev small{font:11.5px var(--f-mono);color:var(--muted)}
.sdev .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;font-size:13px}
.sdev .x:hover{color:var(--danger)}
.svrow .acts2{grid-row:1/3;grid-column:2;display:flex;gap:6px;align-items:center}
.svrow .ed{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.svrow .ed:hover{color:var(--accent);border-color:var(--accent)}
.svrow .go{grid-row:1/3;grid-column:2;color:var(--accent);font-size:12.5px;font-weight:600;white-space:nowrap}
.svrow .ib{color:var(--danger);font-weight:600}
.emptyNote{color:var(--muted);padding:14px}
.dsecs{display:inline-flex;gap:3px;flex-wrap:wrap}
.fichaHead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.fichaHead .cimg{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc,var(--accent)) 14%,var(--panel));color:var(--cc,var(--accent))}
.fichaHead h3{margin:0;font:600 20px var(--f-cond)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}
.fgrid>div{display:grid;gap:10px;align-content:start;min-width:0}
@media (max-width:1560px){.status span{display:none}.status{cursor:help}}
@media (max-width:1100px){#app{grid-template-columns:260px 10px minmax(0,1fr) 10px 270px}}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)!important}
  .stage{grid-column:1!important}
  .rz{display:none}
  #togR{display:none}
  .menuBtn{display:inline-flex}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(330px,88vw);z-index:40;border-radius:0;transform:translateX(-102%);transition:transform .2s;
    padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
  body.showSide .side{transform:none}
  body.showSide .scrim{display:block;position:fixed;inset:0;background:var(--overlay);z-index:35}
  .insp{position:fixed;left:0;right:0;bottom:0;max-height:55%;z-index:30;border-radius:12px 12px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .insp.idle{display:none}
  .insClose{display:inline-flex;align-self:flex-end}
  .mOnly{display:inline-flex}
  .viewSeg button span{display:none}
  .viewSeg button{padding:0 10px}
  .inspTools{display:none}
  .status{display:none}
  .acts .lb{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <button class="btn ic menuBtn" id="menuBtn" aria-label="Abrir panel">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h12M3 9h12M3 13h12"/></svg>
    </button>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true"><path d="M11 33 L22 15 L31.5 29" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="33" r="5" fill="var(--accent)"/><circle cx="22" cy="15" r="5" fill="var(--accent)"/><path d="M34.0 23.0L35.4 28.2L40.0 25.5L37.3 30.1L42.5 31.5L37.3 32.9L40.0 37.5L35.4 34.8L34.0 40.0L32.6 34.8L28.0 37.5L30.7 32.9L25.5 31.5L30.7 30.1L28.0 25.5L32.6 28.2Z" fill="#E0662B"/></svg>
      <span>NOC<span style="color:#E0662B">out</span></span>
    </div>
    <div class="viewSeg" role="tablist" aria-label="Vista">
      <button data-view="clients" title="Clientes en tarjetas"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.2"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.2"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.2"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.2"/></svg><span>Clientes</span></button>
      <button data-view="devices" title="Equipos en tarjetas"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="4.5" width="14" height="7" rx="1.5"/><path d="M4 8h1M7 8h1M11 8h2"/></svg><span>Equipos</span></button>
      <button data-view="diagram" title="Diagramas"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2" width="5" height="4" rx="1"/><rect x="9.5" y="10" width="5" height="4" rx="1"/><path d="M4 6v3.5a2 2 0 0 0 2 2h3.5"/></svg><span>Diagramas</span></button>
    </div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar equipo, IP o cliente…" autocomplete="off">
      <div class="sres" id="sres" hidden></div>
    </div>
    <div class="status" id="status"><i></i><span></span></div>
    <div class="acts">
      <button class="btn" id="bImport"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v8m-3-3 3 3 3-3M3 12v2h10v-2"/></svg><span class="lb">Importar</span></button>
      <button class="btn pri" id="bExport"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 10V2M5 5l3-3 3 3M3 12v2h10v-2"/></svg><span class="lb">Exportar JSON</span></button>
      <button class="btn ic" id="bSettings" aria-label="Ajustes"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
    </div>
  </header>

  <aside class="side" id="side" style="grid-column:1;grid-row:2">
    <nav class="tabs" role="tablist">
      <button data-tab="clientes">Clientes</button>
      <button data-tab="equipos">Equipos</button>
      <button data-tab="impacto">Impacto</button>
      <button data-tab="incidencias">Incidencias<span class="cnt" id="incCnt" hidden></span></button>
    </nav>
    <div class="pane" id="pane"></div>
  </aside>
  <div class="rz" id="rzL" data-rz="L" title="Arrastra para cambiar el ancho · doble clic para restablecer" style="grid-column:2;grid-row:2"></div>
  <div class="scrim" id="scrim"></div>
  <section class="cardsView" id="cardsView" hidden style="grid-column:1/-1;grid-row:2"></section>

  <main class="stage" style="grid-column:3;grid-row:2">
    <div class="bar">
      <button class="btn sm panTog" id="togL" title="Mostrar u ocultar el panel de clientes" aria-label="Mostrar u ocultar panel izquierdo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M6 2.5v11"/><path class="fillL" d="M2.2 3.2h3.1v9.6H2.2z" fill="currentColor" stroke="none"/></svg></button>
      <div class="crumb" id="crumb"></div>
      <button class="btn sm panTog" id="togR" title="Mostrar u ocultar el panel de detalle" aria-label="Mostrar u ocultar panel derecho" style="order:9"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M10 2.5v11"/><path d="M10.7 3.2h3.1v9.6h-3.1z" fill="currentColor" stroke="none"/></svg></button>
      <div class="tools" id="tools">
        <button class="btn sm mOnly" data-act="addDev">+ Equipo</button>
        <button class="btn sm mOnly" data-act="addTxt">+ Texto</button>
        <button class="btn sm mOnly" data-act="addEl">+ Elemento</button>
        <button class="btn sm mOnly" data-act="addGrp">+ Grupo</button>
        <button class="btn sm" id="bUndo" title="Deshacer (Ctrl+Z)" disabled>↶</button><button class="btn sm" id="bRedo" title="Rehacer (Ctrl+Y)" disabled>↷</button>
        <select class="layerSel" id="layerSel" title="Capa de incidencias" aria-label="Capa de incidencias"><option value="activas">Incidencias: activas</option><option value="historial">Incidencias: historial</option><option value="ocultas">Incidencias: ocultas</option></select>
        <button class="btn sm pillTog" id="pillTog" title="Mostrar u ocultar las etiquetas V / T / D de los equipos">V·T·D</button>
        <button class="btn sm pillTog" id="autoLocTog" title="Mostrar u ocultar todos los grupos de ubicación (ciudad, edificio, sitio, piso, sala, gabinete, rack)">📍 Ubicaciones</button>
        <select class="layerSel secSel" id="secSel" title="Resaltar una red" aria-label="Resaltar una red"><option value="">Todas las redes</option><option value="voz">Red de voz</option><option value="transporte">Red de transporte</option><option value="datos">Red de datos</option></select>
      </div>
    </div>
    <div class="canvasWrap">
      <svg id="cv" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="gridp" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" style="fill:var(--grid)"/></pattern>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--edge)"/></marker>
          <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--accent)"/></marker>
          <marker id="arI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--danger)"/></marker>
          <marker id="arH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--hit)"/></marker>
        </defs>
        <rect id="gridbg" x="-50000" y="-50000" width="100000" height="100000" fill="url(#gridp)"/>
        <g id="vp"></g>
      </svg>
      <div class="empty" id="empty" hidden></div>
      <div class="plusMenu" id="plusMenu" hidden></div>
      <div class="banners"><div class="incBanner" id="incBanner" hidden></div></div>
      <div class="impBanner impCard" id="impBanner" hidden></div>
      <button class="impMini" id="impMini" hidden title="Mostrar el resumen de impacto"></button>
      <div class="hint" id="hint">Arrastra el punto <b>●</b> de un equipo hacia otro para conectarlos · Shift+clic o Shift+arrastrar selecciona varios · rueda para zoom</div>
      <div class="zoom">
        <button class="btn sm" id="tFit" title="Ajustar vista para ver todo el diagrama">⤢ Ajustar vista</button>
        <div class="zcol"><button class="btn ic sm" id="zIn" aria-label="Acercar">+</button>
        <button class="btn ic sm" id="zOut" aria-label="Alejar">−</button></div>
      </div>
    </div>
  </main>

  <div class="rz" id="rzR" data-rz="R" title="Arrastra para cambiar el ancho · doble clic para restablecer" style="grid-column:4;grid-row:2"></div>
  <aside class="insp" id="insp" style="grid-column:5;grid-row:2">
    <div class="inspTools">
      <button class="btn sm" data-act="addDev">+ Equipo</button>
      <button class="btn sm" data-act="addTxt">+ Texto</button>
      <button class="btn sm" data-act="addEl" title="Elemento que no se inventaría: caja de empalme, splitter, poste, ODF…">+ Elemento</button>
      <button class="btn sm" data-act="addGrp" title="Engloba los equipos seleccionados (Shift+clic o Shift+arrastrar para seleccionar varios)">+ Grupo</button>
    </div>
    <div id="inspBody"></div>
  </aside>
</div>

<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><header id="mT"></header><div class="mb" id="mB"></div><footer id="mF"></footer></div></div>
<div id="toast" hidden></div>

  D.nodes.forEach(n=>{const dv=n.deviceId&&devById(n.deviceId);if(dv&&dv.place&&(dv.place===pid||placeUnder(dv.place,pid))){n.x+=dx;n.y+=dy;}});
  (D.groups||[]).forEach(g=>{if(g.placeId&&(g.placeId===pid||placeUnder(g.placeId,pid))){g.x+=dx;g.y+=dy;}});}
/* Separa los grupos de ubicación para que no se encimen: hermanos lado a lado y equipos ajenos fuera */
function fixLoc(D){if(!D||ui.folder===MAP||locAllOff())return 0;let moves=0;const G=18;
  for(let it=0;it<80;it++){const B=locBoxes(D);if(!B.length)break;const byP={};B.forEach(b=>byP[b.pid]=b);
    const parentOf=b=>{let p=placeById(placeById(b.pid)?.parentId),gd=0;while(p&&gd++<20){if(byP[p.id])return p.id;p=placeById(p.parentId);}return '';};
    const sib={};B.forEach(b=>{const k=parentOf(b);(sib[k]=sib[k]||[]).push(b);});let did=false;

        if(a.x<b.x+b.w+G&&b.x<a.x+a.w+G&&a.y<b.y+b.h+G&&b.y<a.y+a.h+G){const dx=a.x+a.w+G-b.x,dy=a.y+a.h+G-b.y;if(dx<=dy)shiftPlace(D,b.pid,dx,0);else shiftPlace(D,b.pid,0,dy);did=true;}}}

      const bad=B.filter(b=>cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h&&!(dv&&dv.place&&(dv.place===b.pid||placeUnder(dv.place,b.pid))));
      if(!bad.length)continue;const t=bad.sort((a,b)=>b.w*b.h-a.w*a.h)[0];
      const opts=[[t.x+t.w+G-n.x,0],[0,t.y+t.h+G-n.y],[t.x-G-d.w-n.x,0],[0,t.y-G-d.h-n.y]].sort((a,b)=>Math.abs(a[0])+Math.abs(a[1])-Math.abs(b[0])-Math.abs(b[1]));
      n.x=Math.round((n.x+opts[0][0])/8)*8;n.y=Math.round((n.y+opts[0][1])/8)*8;did=true;break;}
    if(!did)for(const n of D.nodes){const dv=n.deviceId&&devById(n.deviceId);if(!dv||!dv.place)continue;const ch=placeChain(dv.place);let b=null;for(let i=ch.length-1;i>=0&&!b;i--)b=B.find(x=>x.pid===ch[i].id);
      if(!b||!b.ex)continue;const d=dims(n),g=b.g,P=14,x0=Math.min(g.x,n.x-P),y0=Math.min(g.y,n.y-34),x1=Math.max(g.x+g.w,n.x+d.w+P),y1=Math.max(g.y+g.h,n.y+d.h+P);
      if(x0===g.x&&y0===g.y&&x1===g.x+g.w&&y1===g.y+g.h)continue;g.x=Math.floor(x0/8)*8;g.y=Math.floor(y0/8)*8;g.w=Math.ceil((x1-g.x)/8)*8;g.h=Math.ceil((y1-g.y)/8)*8;did=true;break;}

  const hit=(x,y)=>D.nodes.some(o=>{const d=dims(o);return x<o.x+d.w+16&&x+gn.w+16>o.x&&y<o.y+d.h+16&&y+gn.h+16>o.y;});

function autoGroups(D){if(!D||ui.folder===MAP||locAllOff())return [];

function diagHits(D,devId,port){
  const pn=norm(port);const nodes=D.nodes.filter(n=>n.deviceId===devId);if(!nodes.length)return null;
  const ids=new Set(nodes.map(n=>n.id)),edges=new Set(),hitNodes=new Set();
  D.edges.forEach(e=>{const a=ids.has(e.from),b=ids.has(e.to);if(!a&&!b)return;const ok=!pn||(a&&norm(e.fp)===pn)||(b&&norm(e.tp)===pn);if(ok){edges.add(e.id);hitNodes.add(a?e.from:e.to);}});
  if(!pn)nodes.forEach(n=>hitNodes.add(n.id));

}
function impactOf(devId,port){
  const pn=norm(port),items=[];
  for(const [fid,D] of Object.entries(S.diagrams)){
    if(!folById(fid))continue;
    const nodes=D.nodes.filter(n=>n.deviceId===devId); if(!nodes.length)continue;
    const ids=new Set(nodes.map(n=>n.id)),edges=new Set(),ports=new Set(),hitNodes=new Set();
    D.edges.forEach(e=>{
      const a=ids.has(e.from),b=ids.has(e.to); if(!a&&!b)return;
      const ok=!pn||(a&&norm(e.fp)===pn)||(b&&norm(e.tp)===pn);
      if(a&&e.fp)ports.add(e.fp); if(b&&e.tp)ports.add(e.tp);
      if(ok){edges.add(e.id);hitNodes.add(a?e.from:e.to);}

  }

}

function roundPath(P,r){let d=`M${P[0][0]} ${P[0][1]}`;
  for(let i=1;i<P.length-1;i++){const [x0,y0]=P[i-1],[x1,y1]=P[i],[x2,y2]=P[i+1];
    const l1=Math.hypot(x1-x0,y1-y0),l2=Math.hypot(x2-x1,y2-y1),k=Math.min(r,l1/2,l2/2);
    if(k<1){d+=` L${x1} ${y1}`;continue;}
    d+=` L${x1-(x1-x0)/l1*k} ${y1-(y1-y0)/l1*k} Q${x1} ${y1} ${x1+(x2-x1)/l2*k} ${y1+(y2-y1)/l2*k}`;}
  const L=P[P.length-1];return d+` L${L[0]} ${L[1]}`;}
function drawL2L(){
  const g=document.querySelector('#cardsView .sitegrid');if(!g)return;g.querySelector('.l2lsvg')?.remove();
  const rows=[...g.querySelectorAll('[data-l2l]')],by={};rows.forEach(r=>(by[r.dataset.l2l]=by[r.dataset.l2l]||[]).push(r));
  const gr=g.getBoundingClientRect(),cs=getComputedStyle(g),cg=parseFloat(cs.columnGap)||40,rg=parseFloat(cs.rowGap)||16;
  const R=el=>{const r=el.getBoundingClientRect();return{l:r.left-gr.left,r:r.right-gr.left,t:r.top-gr.top,b:r.bottom-gr.top,cy:r.top-gr.top+r.height/2};};
  let out='',lane=0;
  Object.values(by).forEach(list=>{if(list.length<2)return;const A=R(list[0]),BA=R(list[0].closest('.sitebox'));
    list.slice(1).forEach(el=>{const B=R(el),BB=R(el.closest('.sitebox'));lane++;
      const off=((lane%5)-2)*5;
      const rowBottom=t=>Math.max(...[...g.querySelectorAll('.sitebox')].map(R).filter(x=>Math.abs(x.t-t)<4).map(x=>x.b));
      const toRight=BB.l>BA.r-2,toLeft=BB.r<BA.l+2,sameRow=Math.abs(BA.t-BB.t)<4;
      const ax=toLeft?BA.l:BA.r,xg1=toLeft?BA.l-cg/2+off:BA.r+cg/2+off;
      const bx=toRight?BB.l:BB.r,xg2=toRight?BB.l-cg/2+off:BB.r+cg/2+off;
      let P;
      if(Math.abs(xg1-xg2)<2)P=[[ax,A.cy],[xg1,A.cy],[xg1,B.cy],[bx,B.cy]];
      else{let L;if(sameRow)L=rowBottom(BA.t)+rg/2;else if(BB.t>BA.t)L=rowBottom(BA.t)+rg/2;else L=rowBottom(BB.t)+rg/2;L+=off*0.8;
        P=[[ax,A.cy],[xg1,A.cy],[xg1,L],[xg2,L],[xg2,B.cy],[bx,B.cy]];}
      // adyacentes en la misma fila: línea directa por el hueco
      if(sameRow&&((toRight&&Math.abs(BB.l-BA.r-cg)<3)||(toLeft&&Math.abs(BA.l-BB.r-cg)<3)))P=[[ax,A.cy],[xg1,A.cy],[xg1,B.cy],[bx,B.cy]];
      out+=`<path d="${roundPath(P,12)}"/><circle cx="${ax}" cy="${A.cy}" r="5.5"/><circle cx="${bx}" cy="${B.cy}" r="5.5"/>`;});});
  if(!out)return;
  const sv=document.createElementNS('http://www.w3.org/2000/svg','svg');sv.setAttribute('class','l2lsvg');sv.setAttribute('width',g.scrollWidth);sv.setAttribute('height',g.scrollHeight);sv.innerHTML=out;g.appendChild(sv);
}

  if(a.p==='telnet')return{cmd:`telnet ${ip}${a.port&&a.port!=='23'?' '+a.port:''}`,url:`telnet://${ip}${a.port?':'+a.port:''}`};
  const http=a.port==='80'||a.port==='8080';const u=`${http?'http':'https'}://${ip}${a.port&&a.port!=='80'&&a.port!=='443'?':'+a.port:''}`;return{cmd:u,url:u};
}

$('#insp').addEventListener('input',e=>{

  if(e.target.id==='nShape'){const n=D.nodes.find(x=>x.id===ui.sel.id);if(n){if(e.target.value)n.shape=e.target.value;else delete n.shape;save();rc();}return;}
  if(e.target.id==='gSiteQ'){ui.sq=e.target.value;const g=D.groups.find(x=>x.id===ui.sel.id);if(g)$('#gSlist').innerHTML=siteListHTML(g);return;}

  if(ui.sel.t!=='edge')return;
  if(e.target.id==='eFrom'||e.target.id==='eTo'){reconnect(ui.sel.id,e.target.id==='eFrom'?'from':'to',e.target.value);return;}
  const dm={eDp:'demarcPos',eDl:'demarcLabel',eDa:'demarcA',eDb:'demarcB'}[e.target.id];
  if(e.target.id==='eDm'){const ed=D.edges.find(x=>x.id===ui.sel.id);if(ed){ed.demarc=e.target.checked;if(ed.demarc&&ed.demarcLabel==null){ed.demarcLabel='Demarcación';ed.demarcPos=.5;}save();rc();renderInsp();}return;}
  if(dm){const ed=D.edges.find(x=>x.id===ui.sel.id);if(ed){ed[dm]=dm==='demarcPos'?+e.target.value:e.target.value;save();rc();}return;}
  const ed=D.edges.find(x=>x.id===ui.sel.id);if(!ed)return;
  const m={eFp:'fp',eTp:'tp',eLb:'label',eMd:'medium',eDr:'dir'}[e.target.id];if(!m)return;
  ed[m]=e.target.value.trim()===''&&m!=='label'?'':(m==='label'?e.target.value:e.target.value.trim());save();rc();

  if((f.parentId||null)===newParent)return;
  f.parentId=newParent;if(newParent)ui.collapsed.delete(newParent);
  save();renderAll();toast(`«${f.name}» movido a ${newParent?pathOf(newParent).map(x=>x.name).join(' › '):'nivel principal'}`);
}

async function getCap(name){try{if(window.claude&&window.claude.use)return await window.claude.use(name);}catch(e){}return null;}
async function exportJSON(){
  const data=JSON.stringify({...S,meta:{...S.meta,exportedAt:new Date().toISOString()}},null,1);
  const owner=fold(S.meta.owner||'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const filename=`nocout${owner?'-'+owner:''}-${today()}.json`;
  const done=()=>{S.meta.lastExport=today();S.meta.dirty=0;save(false);toast('Respaldo exportado');};
  if(window.claude){
    const dl=await getCap('downloads');
    if(dl){try{await dl.save({filename,data});done();return;}catch(err){if(err&&err.code==='declined')return;}}
    modal('Copia tu respaldo',`<p>Esta vista no permite descargar archivos. Copia el JSON y guárdalo como <span class="mono">${esc(filename)}</span>.</p><textarea class="big" id="expTa" readonly>${esc(data)}</textarea>`,
      [{l:'Cerrar'},{l:'Copiar JSON',k:'pri',f:()=>{copyText(data,$('#expTa'));done();}}]);

  }

}
function copyText(t,fallbackEl){
  const ok=()=>toast('Copiado');
  try{navigator.clipboard.writeText(t).then(ok,()=>sel());}catch(e){sel();}
  function sel(){const ta=fallbackEl||Object.assign(document.createElement('textarea'),{value:t});if(!fallbackEl){ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);}ta.focus();ta.select();try{document.execCommand('copy');ok();}catch(e){toast('Selecciona el texto y cópialo');}if(!fallbackEl)ta.remove();}
}

function mergeData(inc){
  const r={dev:0,devMatch:0,fol:0,edges:0},dm={},fm={};
  (inc.elTypes||[]).forEach(t=>{S.elTypes=S.elTypes||[];if(!S.elTypes.some(x=>fold(x.name)===fold(t.name)))S.elTypes.push({...t});});
  const pm={};const rkP=k=>PKINDS.indexOf(k);
  [...(inc.places||[])].sort((a,b)=>rkP(a.kind)-rkP(b.kind)).forEach(x=>{const par=x.parentId?(pm[x.parentId]||null):null;
    let m=(S.places||[]).find(y=>y.kind===x.kind&&fold(y.name)===fold(x.name)&&(y.parentId||null)===par);
    if(!m){m={...x,parentId:par};if(placeById(m.id))m.id=uid('p');(S.places=S.places||[]).push(m);}pm[x.id]=m.id;});
  inc.devices.forEach(d=>{
    let m=devById(d.id)&&(!d.ip||devById(d.id).ip===d.ip)?devById(d.id):null;
    if(!m&&d.ip)m=S.devices.find(x=>x.ip===d.ip);
    if(!m)m=S.devices.find(x=>norm(x.name)===norm(d.name));
    if(m){dm[d.id]=m.id;r.devMatch++;if(!m.place&&d.place&&pm[d.place])m.place=pm[d.place];m.sections=[...new Set([...(m.sections||[]),...(d.sections||[])])];m.ports=[...new Set([...(m.ports||[]),...(d.ports||[])])];
      ['ip','type','brand','model','location','notes'].forEach(k=>{if(!m[k]&&d[k])m[k]=d[k];});
      (d.access||[]).forEach(a=>{if(!(m.access||[]).some(x=>x.p===a.p))(m.access=m.access||[]).push(a);});}
    else{const nd={...d,ports:[...(d.ports||[])],access:[...(d.access||[])],place:d.place?pm[d.place]:undefined};if(devById(nd.id))nd.id=uid('d');S.devices.push(nd);dm[d.id]=nd.id;r.dev++;}
  });
  (inc.types||[]).forEach(t=>{const m=S.types.find(x=>norm(x.name)===norm(t.name));if(!m)S.types.push({...t});else if(!m.img&&t.img&&m.icon===guessIcon(m.name)&&!m.color)Object.assign(m,{img:t.img});});
  const pending=[...inc.folders];let guard=0;
  while(pending.length&&guard++<5000){
    const f=pending.shift();
    if(f.parentId&&!(f.parentId in fm)&&pending.some(p=>p.id===f.parentId)){pending.push(f);continue;}
    const pid=f.parentId?(fm[f.parentId]||null):null;
    let m=folById(f.id);
    if(!m)m=S.folders.find(x=>(x.parentId||null)===pid&&norm(x.name)===norm(f.name));
    if(m){fm[f.id]=m.id;}else{const nf={...f,parentId:pid};if(folById(nf.id))nf.id=uid('f');S.folders.push(nf);fm[f.id]=nf.id;r.fol++;}
  }
  Object.entries(inc.diagrams||{}).forEach(([fid,ID])=>{
    const tf=fm[fid];if(!tf||!ID)return;
    const D=getDiag(tf,true),nmap={};
    (ID.groups||[]).forEach(g=>{if(!D.groups.some(x=>x.id===g.id||(norm(x.label)===norm(g.label)&&x.kind===g.kind&&g.label)))D.groups.push({...g,placeId:g.placeId?pm[g.placeId]:undefined,siteId:g.siteId?(fm[g.siteId]||undefined):undefined});});
    (ID.nodes||[]).forEach(n=>{
      if(n.deviceId){const did=dm[n.deviceId];if(!did)return;const ex=D.nodes.find(x=>x.deviceId===did);
        if(ex){nmap[n.id]=ex.id;}else{const nn={id:D.nodes.some(x=>x.id===n.id)?uid('n'):n.id,deviceId:did,x:n.x,y:n.y};D.nodes.push(nn);nmap[n.id]=nn.id;}}
      else{const ex=D.nodes.find(x=>!x.deviceId&&x.text===n.text);if(ex)nmap[n.id]=ex.id;else{const nn={...n,id:D.nodes.some(x=>x.id===n.id)?uid('t'):n.id};D.nodes.push(nn);nmap[n.id]=nn.id;}}
    });
    (ID.edges||[]).forEach(e=>{const a=nmap[e.from],b=nmap[e.to];if(!a||!b)return;
      const dup=D.edges.some(x=>((x.from===a&&x.to===b&&norm(x.fp)===norm(e.fp)&&norm(x.tp)===norm(e.tp))||(x.from===b&&x.to===a&&norm(x.fp)===norm(e.tp)&&norm(x.tp)===norm(e.fp))));
      if(!dup){D.edges.push({...e,id:D.edges.some(x=>x.id===e.id)?uid('e'):e.id,from:a,to:b});r.edges++;}});
  });
  (inc.incidents||[]).forEach(i=>{if(S.incidents.some(x=>x.id===i.id))return;const sc=(i.scope||[]).map(x=>({dev:dm[x.dev],port:x.port||''})).filter(x=>x.dev);S.incidents.push({...i,scope:sc});r.inc=(r.inc||0)+1;});
  S.meta.example=S.meta.example&&!r.dev&&!r.fol;ensureTypes(S);
  if(!ui.folder)ui.folder=firstLeaf();
  save();return r;
}
/* CSV */
function parseCSV(text){
  text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';
  const delim=[';','\t',','].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===delim){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()));
}
const COLS={name:['nombre','name','hostname','equipo','host','dispositivo'],ip:['ip','direccion ip','ip address','ip gestion','mgmt','ip de gestion'],type:['tipo','type','categoria'],
  brand:['marca','brand','fabricante','vendor'],model:['modelo','model'],access:['acceso','access','protocolo','protocolos'],aport:['puerto acceso','puerto de acceso','puerto gestion','port'],
  location:['ubicacion','sitio','location','site','nodo'],sections:['seccion','red','section','area','secciones'],ports:['puertos','ports','interfaces','interfaz','ips','puertos/ips','puertos / ips','puertos o ips'],notes:['notas','notes','comentarios','observaciones']};
function csvRows(text){
  const rows=parseCSV(text);if(rows.length<2)return{err:'El archivo necesita una fila de encabezados y al menos un equipo.'};
  const head=rows[0].map(fold),idx={};
  Object.entries(COLS).forEach(([k,al])=>{const i=head.findIndex(h=>al.includes(h));if(i>=0)idx[k]=i;});
  if(idx.name==null&&idx.ip==null)return{err:'No encontré columnas de nombre o IP. Revisa los encabezados.'};
  const g=(r,k)=>idx[k]!=null?(r[idx[k]]||'').trim():'';
  const list=rows.slice(1).map(r=>{
    const t=g(r,'type'),type=t?(S.types.find(x=>fold(x.name)===fold(t))?.name||t):'Otro';
    const accTxt=fold(g(r,'access')),aport=g(r,'aport');
    const access=['ssh','telnet','web'].filter(p=>accTxt.includes(p)||(p==='web'&&/http/.test(accTxt))).map(p=>({p,port:aport}));
    const st=fold(g(r,'sections')),sections=[st.includes('voz')||st.includes('voice')?'voz':'',st.includes('trans')?'transporte':'',st.includes('dato')||st.includes('data')?'datos':''].filter(Boolean);
    return{sections,name:g(r,'name')||g(r,'ip'),ip:g(r,'ip'),type,brand:g(r,'brand'),model:g(r,'model'),access,location:g(r,'location'),
      ports:[...new Set(g(r,'ports').split(/[|;,\n]/).map(s=>s.trim()).filter(Boolean))],notes:g(r,'notes')};
  }).filter(d=>d.name);
  return{list,cols:Object.keys(idx)};
}

$('#fileImg').onchange=e=>{
  const f=e.target.files[0];if(!f||(!tDraft&&!ui.imgCb))return;
  if(f.size>3*1024*1024){toast('La imagen pesa más de 3 MB; usa una más ligera');return;}
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
    const S2=96,c=document.createElement('canvas');c.width=S2;c.height=S2;const x=c.getContext('2d');
    const w=im.naturalWidth||im.width||S2,h=im.naturalHeight||im.height||S2,k=Math.min(S2/w,S2/h);
    x.drawImage(im,(S2-w*k)/2,(S2-h*k)/2,w*k,h*k);
    let url;try{url=c.toDataURL('image/png');}catch(err){url=rd.result;}
    if(ui.imgCb){const cb=ui.imgCb;ui.imgCb=null;cb(url);return;}
    tDraft.img=url;drawTE(drawTE.cnt||0);};
    im.onerror=()=>toast('No se pudo leer la imagen');im.src=rd.result;};
  rd.readAsDataURL(f);
};
function typeDeleteModal(name){

  modal('Eliminar tipo '+name,cnt?`<p>${cnt} equipo${cnt===1?' usa':'s usan'} este tipo. ¿A qué tipo los paso?</p><div class="fld"><select id="tdTo">${others.map(o=>`<option${o==='Otro'?' selected':''}>${esc(o)}</option>`).join('')}</select></div>`:'<p>Ningún equipo usa este tipo.</p>',
    [{l:'Cancelar',f:()=>typeEditModal(name)},{l:'Eliminar tipo',k:'dan pri',f:()=>{
