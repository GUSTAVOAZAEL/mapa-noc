<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mapa NOC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: consola de trabajo a pantalla completa — panel de carpetas/inventario | lienzo con rejilla | inspector */
:root{
  --bg:#E8ECF0; --panel:#FFFFFF; --panel-2:#F3F5F7; --ink:#15212C; --muted:#5A6978; --line:#D3DBE2;
  --accent:#0A6C87; --accent-ink:#FFFFFF; --accent-soft:#DDEEF3;
  --hit:#B05F00; --hit-soft:#FBE9CC; --danger:#B4321C; --danger-soft:#F7E1DC;
  --grid:#C6D0D9; --edge:#536373; --demarc:#B3266E; --node:#FFFFFF; --overlay:rgba(14,22,30,.42);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1318; --panel:#151E26; --panel-2:#1B2630; --ink:#E1E8EE; --muted:#8C9AA7; --line:#2A3845;
  --accent:#4BB4D1; --accent-ink:#06222B; --accent-soft:#163743;
  --hit:#F2A33A; --hit-soft:#3B2B13; --danger:#F07560; --danger-soft:#3A1D18;
  --grid:#24323E; --edge:#93A4B3; --demarc:#F06BB0; --node:#18232D; --overlay:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1318; --panel:#151E26; --panel-2:#1B2630; --ink:#E1E8EE; --muted:#8C9AA7; --line:#2A3845;
  --accent:#4BB4D1; --accent-ink:#06222B; --accent-soft:#163743;
  --hit:#F2A33A; --hit-soft:#3B2B13; --danger:#F07560; --danger-soft:#3A1D18;
  --grid:#24323E; --edge:#93A4B3; --demarc:#F06BB0; --node:#18232D; --overlay:rgba(0,0,0,.55); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);overflow:hidden}
[hidden]{display:none!important}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-columns:290px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:9px;font:600 17px/1 var(--f-cond);letter-spacing:.01em;white-space:nowrap}
.brand svg{color:var(--accent)}
.search{position:relative;flex:1 1 260px;min-width:0;max-width:520px}
.search input{width:100%;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 12px 0 34px}
.search>svg{position:absolute;left:11px;top:10px;color:var(--muted)}
.sres{position:absolute;top:40px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:30;max-height:60vh;overflow:auto;padding:4px}
.sres button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;border:0;background:none;padding:7px 9px;border-radius:5px;cursor:pointer}
.sres button:hover,.sres button.on{background:var(--panel-2)}
.sres .k{font:500 10.5px/1 var(--f-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:58px;flex:none}
.sres .sub{color:var(--muted);font-size:12px;margin-left:auto;font-family:var(--f-mono)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.status.warn i{background:var(--hit)}
.acts{display:flex;gap:6px;margin-left:auto}

.btn{height:34px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.dan{color:var(--danger);border-color:var(--danger)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn.ic{width:34px;padding:0;justify-content:center}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--panel-2)}
.btn[disabled]{opacity:.45;cursor:default}
.menuBtn{display:none}

.side,.insp,.stage{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;min-width:0}
.side{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px}
.tabs button{flex:1;border:0;background:none;padding:11px 2px 9px;cursor:pointer;color:var(--muted);font:500 12.5px var(--f-ui);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.pane{flex:1;overflow:auto;padding:10px}
.paneHead{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.paneHead .grow{flex:1}
.lbl{font:500 10.5px/1.2 var(--f-ui);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.note{background:var(--hit-soft);border-radius:6px;padding:9px 10px;font-size:12.5px;margin-bottom:10px;display:grid;gap:6px}
.note b{font-weight:600}

/* árbol */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{padding-left:14px;border-left:1px solid var(--line);margin-left:9px}
.row{display:flex;align-items:center;gap:4px;border-radius:5px;padding:3px 4px;cursor:pointer;min-width:0}
.row:hover{background:var(--panel-2)}
.row.on{background:var(--accent-soft)}
.row .car{width:18px;height:18px;border:0;background:none;padding:0;cursor:pointer;color:var(--muted);flex:none;display:grid;place-items:center}
.row .car.none{visibility:hidden}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{font:500 9.5px/1 var(--f-mono);text-transform:uppercase;padding:3px 4px;border-radius:3px;border:1px solid var(--line);color:var(--muted);flex:none}
.kind.cliente{color:var(--accent);border-color:var(--accent)}
.row .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;opacity:.75}
.row .ra{display:none;gap:2px}
.row:hover .ra,.row.on .ra{display:flex}
.ra button{width:24px;height:24px;border:0;background:none;border-radius:4px;cursor:pointer;color:var(--muted)}
.ra button:hover{background:var(--panel);color:var(--ink)}
.row.hit .nm{color:var(--hit);font-weight:500}

/* inventario */
.dlist{display:grid;gap:2px}
.drow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px;border-radius:5px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.drow:hover{background:var(--panel-2)}
.drow .t{min-width:0}
.drow .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .ip{font:12px var(--f-mono);color:var(--muted)}
.drow .use{font:11px var(--f-mono);color:var(--muted)}
.drow svg{color:var(--accent)}
.fld{display:grid;gap:4px;margin-bottom:10px}
.fld input,.fld select,.fld textarea,.inp{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;min-width:0}
.fld textarea{resize:vertical;min-height:70px}

/* impacto */
.imp{display:grid;gap:10px}
.sum{display:flex;gap:16px;padding:10px;background:var(--hit-soft);border-radius:6px}
.sum div{display:grid}
.sum b{font:600 22px/1.1 var(--f-cond);color:var(--hit)}
.sum span{font-size:11.5px;color:var(--muted)}
.grp{display:grid;gap:3px}
.grp h4{margin:6px 0 2px;font:600 13px var(--f-ui)}
.irow{border:0;background:none;text-align:left;padding:6px 8px;border-radius:5px;cursor:pointer;display:grid;gap:2px;width:100%;border-left:2px solid var(--hit)}
.irow:hover{background:var(--panel-2)}
.irow .p{font-size:12px;color:var(--muted)}
.irow .pp{font:11.5px var(--f-mono);color:var(--hit)}

/* lienzo */
.stage{position:relative;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;font-size:13px;color:var(--muted)}
.crumb b{color:var(--ink);font:600 15px var(--f-cond);overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.canvasWrap{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block;background:var(--panel-2)}
#cv.panning{cursor:grabbing}
.hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;pointer-events:none;max-width:calc(100% - 70px)}
.banners{position:absolute;left:10px;top:10px;right:10px;display:grid;gap:6px;pointer-events:none}
.banners>*{pointer-events:auto}
.incBanner{display:flex;gap:10px;align-items:center;background:var(--danger-soft);border:1px solid var(--danger);border-radius:6px;padding:6px 8px 6px 12px;font-size:13px;flex-wrap:wrap}
.incBanner b{color:var(--danger)}
.incBanner .grow{flex:1}
.impBanner{display:flex;gap:10px;align-items:center;background:var(--hit-soft);border:1px solid var(--hit);border-radius:6px;padding:6px 8px 6px 12px;font-size:13px;flex-wrap:wrap}
.impBanner b{color:var(--hit)}
.impBanner .grow{flex:1}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:20px}
.empty div{max-width:340px;text-align:center;color:var(--muted);display:grid;gap:8px}
.empty h3{margin:0;color:var(--ink);font:600 18px var(--f-cond)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}

/* svg */
.node .nb{fill:var(--node);stroke:var(--line);stroke-width:1.2}
.node .nm{font:600 13px var(--f-cond);fill:var(--ink)}
.node .ipt{font:11px var(--f-mono);fill:var(--muted)}
.node .gl{color:var(--accent)}
.node .hd{fill:var(--panel);stroke:var(--accent);stroke-width:1.5;cursor:crosshair;opacity:.0;transition:opacity .12s}
.node:hover .hd,.node.sel .hd{opacity:1}
@media (hover:none){.node .hd{opacity:.9}}
.node .plus{cursor:pointer;opacity:0;transition:opacity .12s}
.node .plus circle{fill:var(--accent)}
.node .plus path{stroke:var(--accent-ink);stroke-width:1.8;stroke-linecap:round}
.node:hover .plus,.node.sel .plus{opacity:1}
@media (hover:none){.node.sel .plus{opacity:1}}
.eend{fill:var(--panel);stroke:var(--accent);stroke-width:2;cursor:grab}
.eend:hover{fill:var(--accent)}
.plusMenu{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:4px;display:grid;min-width:190px}
.plusMenu button{display:flex;gap:8px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:5px;cursor:pointer;text-align:left}
.plusMenu button:hover{background:var(--panel-2)}
.plusMenu small{color:var(--muted);display:block;font-size:11.5px}
.pick .create{grid-template-columns:22px 1fr;color:var(--accent);font-weight:500}
.endSel{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 6px;font:600 13px var(--f-cond)}
.node{cursor:move}
.node.sel .nb{stroke:var(--accent);stroke-width:2}
.node.hit .nb{stroke:var(--hit);stroke-width:2.5;fill:var(--hit-soft)}
.node.dim{opacity:.38}
.node.txt .tb{fill:transparent;stroke:transparent}
.node.txt.sel .tb{stroke:var(--accent);stroke-dasharray:4 3}
.node.txt text{font:13px var(--f-ui);fill:var(--ink)}
.edge line.ln{stroke:var(--edge);stroke-width:1.8;fill:none}
.edge.sel line.ln{stroke:var(--accent);stroke-width:2.6}
.edge.hit line.ln{stroke:var(--hit);stroke-width:3}
.edge.dim{opacity:.3}
.edge .eh{stroke:transparent;stroke-width:14;cursor:pointer}
.pl rect{fill:var(--panel);stroke:var(--line)}
.pl text{font:10.5px var(--f-mono);fill:var(--ink)}
.edge.hit .pl rect{stroke:var(--hit);fill:var(--hit-soft)}
.edge.sel .pl rect{stroke:var(--accent)}
.ml text{font:italic 11px var(--f-ui);fill:var(--muted)}
.tmp{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}

/* inspector */
.insp{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.insp h3{margin:0;font:600 17px/1.2 var(--f-cond);overflow-wrap:anywhere}
.insp .sub{color:var(--muted);font-size:12.5px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.acc{display:grid;gap:6px}
.accRow{display:grid;grid-template-columns:46px minmax(0,1fr) auto auto;gap:6px;align-items:center;background:var(--panel-2);border-radius:6px;padding:5px 6px}
.accRow .pr{font:500 10.5px var(--f-mono);text-transform:uppercase;color:var(--accent)}
.accRow code{font:12px var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accRow a{font-size:12px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:11.5px var(--f-mono);padding:2px 6px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);cursor:pointer}
.chip:hover{border-color:var(--hit);color:var(--hit)}
.sep{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.ends{display:grid;gap:8px}
.end{display:grid;gap:4px;padding:8px;border-radius:6px;background:var(--panel-2)}
.end .who{font:600 13px var(--f-cond)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.insClose{display:none}

/* modal y toast */
.modal{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:50;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.mbox{background:var(--panel);border-radius:10px;width:min(560px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);min-width:0}
.mbox header{padding:16px 18px 4px;font:600 18px var(--f-cond)}
.mbox .mb{padding:10px 18px;overflow:auto;min-width:0}
.mbox footer{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mbox p{margin:0 0 10px}
.chk{display:flex;gap:8px;align-items:center}
.accEdit{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.accEdit input[type=text]{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px}
.pick{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:6px;margin-top:8px}
.pick button{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:8px;cursor:pointer}
.pick button:hover{background:var(--panel-2)}
.pick button[disabled]{opacity:.5}
.pick svg{color:var(--accent)}
pre.code{background:var(--panel-2);border-radius:6px;padding:9px;font:12px var(--f-mono);overflow:auto;white-space:pre;margin:0 0 10px}
textarea.big{width:100%;min-height:200px;font:12px var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--panel-2)}
.choice{display:grid;gap:8px}
.choice button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px;cursor:pointer;display:grid;gap:2px}
.choice button:hover{border-color:var(--accent)}
.choice b{font-weight:600}
.choice span{color:var(--muted);font-size:12.5px}
.err{color:var(--danger);font-size:12.5px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:6px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
.scrim{display:none}


/* tipos de equipo */
.ticon{flex:none;object-fit:contain;display:block}
.trows{display:grid}
.trow{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.trow .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.trow .tc{font:12px var(--f-mono);color:var(--muted)}
.tbox{width:34px;height:34px;border-radius:7px;background:var(--panel-2);display:grid;place-items:center}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.igrid button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 2px 6px;display:grid;justify-items:center;gap:5px;font-size:10.5px;color:var(--muted);cursor:pointer}
.igrid button svg{color:var(--ink)}
.igrid button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.sw{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.sw input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:2px;cursor:pointer}
.imgRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.imgPrev{width:56px;height:56px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;background:var(--panel-2)}
.imgPrev img{max-width:48px;max-height:48px}
.tprev{display:flex;justify-content:center;padding:12px;background:var(--panel-2);border-radius:8px;margin-bottom:12px}
.tprev svg{max-width:100%}


/* incidencias */
.tabs .cnt{display:inline-block;min-width:16px;padding:0 4px;margin-left:3px;border-radius:8px;background:var(--danger);color:var(--panel);font:600 10px/16px var(--f-ui)}
.layerSel{height:28px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 6px;font-size:12.5px}
.node.inc .nb{stroke:var(--danger);stroke-width:2.4}
.node.inc.hit .nb{stroke:var(--hit)}
.edge.inc line.ln{stroke:var(--danger);stroke-width:2.6}
.edge.inc.hit line.ln{stroke:var(--hit)}
.edge.inc .pl rect{stroke:var(--danger)}
.ibadge circle{fill:var(--danger)}
.ibadge text{font:700 11px var(--f-ui);fill:#fff}
.node.inc .halo{fill:none;stroke:var(--danger);stroke-opacity:.35;stroke-width:6}
@media (prefers-reduced-motion:no-preference){.node.inc.act .halo{animation:pulse 1.8s ease-in-out infinite}}
@keyframes pulse{50%{stroke-opacity:.08}}
.row .incdot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none}
.ilist{display:grid;gap:6px}
.icard{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:9px 10px;text-align:left;cursor:pointer;display:grid;gap:3px;width:100%}
.icard:hover{border-color:var(--muted)}
.icard.act{border-color:var(--danger);background:var(--danger-soft)}
.icard .ih{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
.icard b{font-weight:600;overflow-wrap:anywhere}
.icard .it{font:12px var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.icard .ia{font-size:12px}
.sev{font:600 10px/1 var(--f-ui);text-transform:uppercase;letter-spacing:.05em;padding:3px 5px;border-radius:3px;border:1px solid currentColor}
.sev.critica{color:var(--danger)} .sev.mayor{color:var(--hit)} .sev.menor{color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;border:0;background:var(--panel);padding:5px 4px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--ink);font-weight:500}
.rank{display:grid;gap:3px}
.rank button{display:grid;grid-template-columns:minmax(0,1fr) 90px 26px;gap:8px;align-items:center;border:0;background:none;padding:5px 4px;border-radius:5px;cursor:pointer;text-align:left;width:100%}
.rank button:hover{background:var(--panel-2)}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.rank .bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--danger)}
.rank .n{font:12px var(--f-mono);text-align:right}
.scope{display:grid;gap:6px}
.scRow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 30px;gap:6px}
.scRow select{min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px}
.affect{background:var(--panel-2);border-radius:6px;padding:8px 10px;font-size:12.5px;display:grid;gap:3px;max-height:150px;overflow:auto}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.three,.two{grid-template-columns:1fr}}


/* secciones, demarcación y grupos */
.secs{display:inline-flex;gap:3px;flex-wrap:wrap}
.sec{font:600 10px/1 var(--f-ui);padding:3px 5px;border-radius:3px;color:#fff}
.drow .secs{margin-left:4px;vertical-align:1px}
.spill text{font:700 8.5px var(--f-ui);fill:#fff}
.node.sdim{opacity:.22}
.edge.sdim{opacity:.18}
.dm line{stroke:var(--demarc);stroke-width:3.2;stroke-linecap:round}
.dm text{font:600 10px var(--f-ui);fill:var(--demarc);paint-order:stroke;stroke:var(--panel-2);stroke-width:3px}
.dm text.sd{font:italic 500 9.5px var(--f-ui)}
.grp .gb{fill-opacity:.05;stroke-width:1.5;pointer-events:none}
.grp .gh{fill:transparent;cursor:move}
.grp .gt{font:600 11px var(--f-cond);letter-spacing:.04em;pointer-events:none}
.grp .gt tspan.k{text-transform:uppercase;font:600 9.5px var(--f-ui);letter-spacing:.08em}
.grp .gr{fill:var(--panel);stroke:var(--accent);stroke-width:1.5;cursor:nwse-resize;opacity:0}
.grp:hover .gr,.grp.sel .gr{opacity:1}
.grp.sel .gb{stroke-width:2.5}
.grp.inc .gb{stroke:var(--danger)!important;stroke-width:2.5}
.marquee{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-dasharray:4 3}
.chkrow{display:flex;gap:14px;flex-wrap:wrap}
.fld input[type=checkbox]{width:auto;padding:0}
.fld input[type=range]{padding:0;border:0;background:none}
.crumb{flex:1 1 200px}
.secSel{max-width:150px}


/* formas de nodo y herramientas del panel */
.node .nm.sm{font-size:12px}
.node.sh-ring .nb{stroke:var(--edge);stroke-width:2}
.node .rdot{fill:var(--node);stroke:var(--accent);stroke-width:1.6}
.node.sh-icon .nb{fill:transparent;stroke:transparent}
.node.sh-icon.sel .nb{stroke:var(--accent);stroke-dasharray:4 3}
.node.sh-icon.hit .nb{stroke:var(--hit)}
.node.sh-icon.inc .nb{stroke:var(--danger)}
.shgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.shgrid button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 2px 5px;display:grid;justify-items:center;gap:3px;font-size:10.5px;color:var(--muted);cursor:pointer}
.shgrid button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.shgrid .mo{fill:var(--panel-2);stroke:currentColor;stroke-width:4}
.inspTools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.inspTools .btn{justify-content:center}
#inspBody{display:flex;flex-direction:column;gap:12px;min-width:0}
.mOnly{display:none}

@media (max-width:1100px){#app{grid-template-columns:260px minmax(0,1fr) 270px}}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  .menuBtn{display:inline-flex}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(330px,88vw);z-index:40;border-radius:0;transform:translateX(-102%);transition:transform .2s;
    padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
  body.showSide .side{transform:none}
  body.showSide .scrim{display:block;position:fixed;inset:0;background:var(--overlay);z-index:35}
  .insp{position:fixed;left:0;right:0;bottom:0;max-height:55%;z-index:30;border-radius:12px 12px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .insp.idle{display:none}
  .insClose{display:inline-flex;align-self:flex-end}
  .mOnly{display:inline-flex}
  .inspTools{display:none}
  .status{display:none}
  .acts .lb{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app">
  <header class="top">
    <button class="btn ic menuBtn" id="menuBtn" aria-label="Abrir panel">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h12M3 9h12M3 13h12"/></svg>
    </button>
    <div class="brand">

    </div>
    <div class="status" id="status"><i></i><span></span></div>
    <div class="acts">

      <button class="btn pri" id="bExport"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 10V2M5 5l3-3 3 3M3 12v2h10v-2"/></svg><span class="lb">Exportar JSON</span></button>
      <button class="btn ic" id="bSettings" aria-label="Ajustes"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
    </div>
  </header>

  <aside class="side" id="side">

    </nav>
    <div class="pane" id="pane"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="stage">
    <div class="bar">
      <div class="crumb" id="crumb"></div>
      <div class="tools" id="tools">
        <button class="btn sm mOnly" data-act="addDev">+ Equipo</button>
        <button class="btn sm mOnly" data-act="addTxt">+ Texto</button>
        <button class="btn sm mOnly" data-act="addGrp">+ Grupo</button>
        <button class="btn sm" id="tFit">Ajustar vista</button>
        <select class="layerSel" id="layerSel" title="Capa de incidencias" aria-label="Capa de incidencias"><option value="activas">Incidencias: activas</option><option value="historial">Incidencias: historial</option><option value="ocultas">Incidencias: ocultas</option></select>
        <select class="layerSel secSel" id="secSel" title="Resaltar una red" aria-label="Resaltar una red"><option value="">Todas las redes</option><option value="voz">Red de voz</option><option value="transporte">Red de transporte</option><option value="datos">Red de datos</option></select>
      </div>
    </div>
    <div class="canvasWrap">
      <svg id="cv" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="gridp" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" style="fill:var(--grid)"/></pattern>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--edge)"/></marker>
          <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--accent)"/></marker>
          <marker id="arI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--danger)"/></marker>
          <marker id="arH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--hit)"/></marker>
        </defs>
        <rect id="gridbg" x="-50000" y="-50000" width="100000" height="100000" fill="url(#gridp)"/>
        <g id="vp"></g>
      </svg>
      <div class="empty" id="empty" hidden></div>
      <div class="plusMenu" id="plusMenu" hidden></div>
      <div class="banners"><div class="incBanner" id="incBanner" hidden></div><div class="impBanner" id="impBanner" hidden></div></div>
      <div class="hint" id="hint">Arrastra el punto <b>●</b> de un equipo hacia otro para conectarlos · Shift+clic o Shift+arrastrar selecciona varios · rueda para zoom</div>
      <div class="zoom">
        <button class="btn ic sm" id="zIn" aria-label="Acercar">+</button>
        <button class="btn ic sm" id="zOut" aria-label="Alejar">−</button>
      </div>
    </div>
  </main>

  <aside class="insp" id="insp">
    <div class="inspTools">
      <button class="btn sm" data-act="addDev">+ Equipo</button>
      <button class="btn sm" data-act="addTxt">+ Texto</button>
      <button class="btn sm" data-act="addGrp" title="Engloba los equipos seleccionados (Shift+clic o Shift+arrastrar para seleccionar varios)">+ Grupo</button>
    </div>
    <div id="inspBody"></div>
  </aside>
</div>

<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><header id="mT"></header><div class="mb" id="mB"></div><footer id="mF"></footer></div></div>
<div id="toast" hidden></div>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileImg" accept="image/png,image/jpeg,image/svg+xml,image/webp,image/gif" hidden>
<input type="file" id="fileCsv" accept=".csv,.txt,text/csv" hidden>

const devById=id=>S.devices.find(d=>d.id===id);

function getDiag(fid,create){if(!S.diagrams[fid]&&create)S.diagrams[fid]={nodes:[],edges:[],groups:[]};const D=S.diagrams[fid]||{nodes:[],edges:[],groups:[]};if(!D.groups)D.groups=[];return D;}
function pathOf(fid){const out=[];let f=folById(fid);while(f){out.unshift(f);f=folById(f.parentId);}return out;}
function clientOf(fid){const p=pathOf(fid);return p[0]||null;}
function devicePorts(id){
  const s=new Set((devById(id)?.ports)||[]);
  for(const D of Object.values(S.diagrams)){const m={};D.nodes.forEach(n=>{if(n.deviceId===id)m[n.id]=1;});
    D.edges.forEach(e=>{if(m[e.from]&&e.fp)s.add(e.fp);if(m[e.to]&&e.tp)s.add(e.tp);});}
  return [...s].filter(Boolean).sort(ncmp);
}
function usage(id){let c=0;for(const D of Object.values(S.diagrams))if(D.nodes.some(n=>n.deviceId===id))c++;return c;}

/* ---------- impacto ---------- */
function impactOf(devId,port){
  const pn=norm(port),items=[];
  for(const [fid,D] of Object.entries(S.diagrams)){
    if(!folById(fid))continue;
    const nodes=D.nodes.filter(n=>n.deviceId===devId); if(!nodes.length)continue;
    const ids=new Set(nodes.map(n=>n.id)),edges=new Set(),ports=new Set(),hitNodes=new Set();
    D.edges.forEach(e=>{
      const a=ids.has(e.from),b=ids.has(e.to); if(!a&&!b)return;
      const ok=!pn||(a&&norm(e.fp)===pn)||(b&&norm(e.tp)===pn);
      if(a&&e.fp)ports.add(e.fp); if(b&&e.tp)ports.add(e.tp);
      if(ok){edges.add(e.id);hitNodes.add(a?e.from:e.to);}
    });
    if(!pn)nodes.forEach(n=>hitNodes.add(n.id));
    if(pn&&!edges.size)continue;
    items.push({fid,edges,nodes:hitNodes,ports:[...ports].sort(ncmp)});
  }
  return items;
}

}

  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  const pane=$('#pane');
  if(ui.tab==='clientes')pane.innerHTML=sideClients();
  else if(ui.tab==='equipos')pane.innerHTML=sideDevices();
  else if(ui.tab==='incidencias')pane.innerHTML=sideIncidents();
  else pane.innerHTML=sideImpact();
  const na=activeIncs().length,cn=$('#incCnt');cn.hidden=!na;cn.textContent=na;

    return '<ul'+(pid?'':' class="tree"')+'>'+ks.map(f=>{
      const has=kids(f.id).length,open=!ui.collapsed.has(f.id),dg=S.diagrams[f.id]?.nodes.length;

        <button class="car${has?'':' none'}" data-tog="${f.id}" aria-label="Expandir">${open?'▾':'▸'}</button>
        <span class="kind ${f.kind}">${esc(KINDS[f.kind]||'')}</span>
        <span class="nm" title="${esc(f.name)}">${esc(f.name)}</span>${incF.has(f.id)?'<span class="incdot" title="Incidencia activa"></span>':''}${dg?'<span class="dot" title="Tiene diagrama"></span>':''}

$('#insp').addEventListener('input',e=>{
  const D=ui.folder&&getDiag(ui.folder);if(!D||!ui.sel)return;
  if(e.target.id==='nTxt'){const n=D.nodes.find(x=>x.id===ui.sel.id);if(n){n.text=e.target.value;save();rc();}return;}
  if(e.target.id==='nShape'){const n=D.nodes.find(x=>x.id===ui.sel.id);if(n){if(e.target.value)n.shape=e.target.value;else delete n.shape;save();rc();}return;}
  if(ui.sel.t==='group'){const g=D.groups.find(x=>x.id===ui.sel.id);if(!g)return;const m={gLabel:'label',gKind:'kind',gNotes:'notes'}[e.target.id];if(m){g[m]=e.target.value;save();rc();}return;}
  if(ui.sel.t!=='edge')return;
  if(e.target.id==='eFrom'||e.target.id==='eTo'){reconnect(ui.sel.id,e.target.id==='eFrom'?'from':'to',e.target.value);return;}
  const dm={eDp:'demarcPos',eDl:'demarcLabel',eDa:'demarcA',eDb:'demarcB'}[e.target.id];
  if(e.target.id==='eDm'){const ed=D.edges.find(x=>x.id===ui.sel.id);if(ed){ed.demarc=e.target.checked;if(ed.demarc&&ed.demarcLabel==null){ed.demarcLabel='Demarcación';ed.demarcPos=.5;}save();rc();renderInsp();}return;}
  if(dm){const ed=D.edges.find(x=>x.id===ui.sel.id);if(ed){ed[dm]=dm==='demarcPos'?+e.target.value:e.target.value;save();rc();}return;}
  const ed=D.edges.find(x=>x.id===ui.sel.id);if(!ed)return;
  const m={eFp:'fp',eTp:'tp',eLb:'label',eMd:'medium',eDr:'dir'}[e.target.id];if(!m)return;
  ed[m]=e.target.value.trim()===''&&m!=='label'?'':(m==='label'?e.target.value:e.target.value.trim());save();rc();
});
$('#insp').addEventListener('change',e=>{
  if(!['eFp','eTp'].includes(e.target.id))return;
  const D=getDiag(ui.folder),ed=D.edges.find(x=>x.id===ui.sel?.id);if(!ed)return;
  const n=D.nodes.find(x=>x.id===(e.target.id==='eFp'?ed.from:ed.to)),d=n&&devById(n.deviceId),v=e.target.value.trim();
  if(d&&v&&!d.ports.some(p=>norm(p)===norm(v))){d.ports.push(v);save();}
  if(e.target.id==='eDr')renderInsp();
  renderSide();
});

/* ---------- exportar / importar ---------- */
async function getCap(name){try{if(window.claude&&window.claude.use)return await window.claude.use(name);}catch(e){}return null;}
async function exportJSON(){
  const data=JSON.stringify({...S,meta:{...S.meta,exportedAt:new Date().toISOString()}},null,1);
  const owner=fold(S.meta.owner||'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const filename=`mapa-noc${owner?'-'+owner:''}-${today()}.json`;
  const done=()=>{S.meta.lastExport=today();S.meta.dirty=0;save(false);toast('Respaldo exportado');};
  if(window.claude){
    const dl=await getCap('downloads');
    if(dl){try{await dl.save({filename,data});done();return;}catch(err){if(err&&err.code==='declined')return;}}
    modal('Copia tu respaldo',`<p>Esta vista no permite descargar archivos. Copia el JSON y guárdalo como <span class="mono">${esc(filename)}</span>.</p><textarea class="big" id="expTa" readonly>${esc(data)}</textarea>`,
      [{l:'Cerrar'},{l:'Copiar JSON',k:'pri',f:()=>{copyText(data,$('#expTa'));done();}}]);
    return;
  }
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();done();}catch(e){toast('No se pudo descargar');}
}
function copyText(t,fallbackEl){
  const ok=()=>toast('Copiado');
  try{navigator.clipboard.writeText(t).then(ok,()=>sel());}catch(e){sel();}
  function sel(){const ta=fallbackEl||Object.assign(document.createElement('textarea'),{value:t});if(!fallbackEl){ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);}ta.focus();ta.select();try{document.execCommand('copy');ok();}catch(e){toast('Selecciona el texto y cópialo');}if(!fallbackEl)ta.remove();}
}
function importModal(){
  modal('Importar',`<div class="choice">
    <button data-imp-k="file"><b>Archivo JSON de un compañero</b><span>Combínalo con tus diagramas o reemplaza todo.</span></button>
    <button data-imp-k="paste"><b>Pegar JSON</b><span>Si te lo enviaron como texto.</span></button>
    <button data-imp-k="csv"><b>Inventario de equipos en CSV</b><span>Desde Excel: nombre, IP, tipo, marca, modelo, acceso, puertos…</span></button></div>`,[{l:'Cerrar'}]);
  $('#mB').onclick=e=>{const b=e.target.closest('[data-imp-k]');if(!b)return;const k=b.dataset.impK;

    if(k==='csv')csvModal();

  };
}
$('#fileJson').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{askMerge(JSON.parse(r.result));}catch(err){modal('Archivo no válido','<p>No se pudo leer el archivo como JSON.</p>',[{l:'Cerrar'}]);}};r.readAsText(f);};
function askMerge(inc){
  if(!inc||!Array.isArray(inc.devices)||!Array.isArray(inc.folders)){modal('Archivo no válido','<p>El JSON no tiene el formato de Mapa NOC.</p>',[{l:'Cerrar'}]);return;}
  const who=inc.meta?.owner?` de <b>${esc(inc.meta.owner)}</b>`:'';
  modal('Importar datos',`<p>El archivo${who} trae <b>${inc.devices.length}</b> equipos, <b>${inc.folders.length}</b> carpetas y <b>${Object.keys(inc.diagrams||{}).length}</b> diagramas.</p>
    <div class="choice"><button data-m="merge"><b>Combinar con lo mío</b><span>Los equipos se empatan por IP o nombre. Agrega carpetas, diagramas y conexiones que no tengas; lo tuyo no se borra.</span></button>
    <button data-m="replace"><b>Reemplazar todo</b><span>Tu información actual se sustituye por la del archivo. Exporta un respaldo antes.</span></button></div>`,[{l:'Cancelar'}]);
  $('#mB').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;
    if(b.dataset.m==='replace'){const owner=S.meta.owner;S={...emptyData(),...inc,meta:{...emptyData().meta,owner,lastExport:S.meta.lastExport}};S.diagrams=S.diagrams||{};ensureTypes(S);ui.folder=firstLeaf();ui.sel=null;ui.impact=null;save();closeModal();renderAll();requestAnimationFrame(fit);toast('Datos reemplazados');}
    else{const r=mergeData(inc);closeModal();renderAll();modal('Combinación lista',`<dl class="kv"><dt>Equipos nuevos</dt><dd>${r.dev}</dd><dt>Equipos empatados</dt><dd>${r.devMatch}</dd><dt>Carpetas nuevas</dt><dd>${r.fol}</dd><dt>Conexiones nuevas</dt><dd>${r.edges}</dd><dt>Incidencias nuevas</dt><dd>${r.inc||0}</dd></dl>`,[{l:'Listo',k:'pri'}]);}
  };
}
function mergeData(inc){
  const r={dev:0,devMatch:0,fol:0,edges:0},dm={},fm={};
  inc.devices.forEach(d=>{
    let m=devById(d.id)&&(!d.ip||devById(d.id).ip===d.ip)?devById(d.id):null;
    if(!m&&d.ip)m=S.devices.find(x=>x.ip===d.ip);
    if(!m)m=S.devices.find(x=>norm(x.name)===norm(d.name));
    if(m){dm[d.id]=m.id;r.devMatch++;m.sections=[...new Set([...(m.sections||[]),...(d.sections||[])])];m.ports=[...new Set([...(m.ports||[]),...(d.ports||[])])];
      ['ip','type','brand','model','location','notes'].forEach(k=>{if(!m[k]&&d[k])m[k]=d[k];});
      (d.access||[]).forEach(a=>{if(!(m.access||[]).some(x=>x.p===a.p))(m.access=m.access||[]).push(a);});}
    else{const nd={...d,ports:[...(d.ports||[])],access:[...(d.access||[])]};if(devById(nd.id))nd.id=uid('d');S.devices.push(nd);dm[d.id]=nd.id;r.dev++;}
  });
  (inc.types||[]).forEach(t=>{const m=S.types.find(x=>norm(x.name)===norm(t.name));if(!m)S.types.push({...t});else if(!m.img&&t.img&&m.icon===guessIcon(m.name)&&!m.color)Object.assign(m,{img:t.img});});
  const pending=[...inc.folders];let guard=0;
  while(pending.length&&guard++<5000){
    const f=pending.shift();
    if(f.parentId&&!(f.parentId in fm)&&pending.some(p=>p.id===f.parentId)){pending.push(f);continue;}
    const pid=f.parentId?(fm[f.parentId]||null):null;
    let m=folById(f.id);
    if(!m)m=S.folders.find(x=>(x.parentId||null)===pid&&norm(x.name)===norm(f.name));
    if(m){fm[f.id]=m.id;}else{const nf={...f,parentId:pid};if(folById(nf.id))nf.id=uid('f');S.folders.push(nf);fm[f.id]=nf.id;r.fol++;}
  }
  Object.entries(inc.diagrams||{}).forEach(([fid,ID])=>{
    const tf=fm[fid];if(!tf||!ID)return;

        if(ex){nmap[n.id]=ex.id;}else{const nn={id:D.nodes.some(x=>x.id===n.id)?uid('n'):n.id,deviceId:did,x:n.x,y:n.y};D.nodes.push(nn);nmap[n.id]=nn.id;}}
      else{const ex=D.nodes.find(x=>!x.deviceId&&x.text===n.text);if(ex)nmap[n.id]=ex.id;else{const nn={...n,id:D.nodes.some(x=>x.id===n.id)?uid('t'):n.id};D.nodes.push(nn);nmap[n.id]=nn.id;}}
    });

      const dup=D.edges.some(x=>((x.from===a&&x.to===b&&norm(x.fp)===norm(e.fp)&&norm(x.tp)===norm(e.tp))||(x.from===b&&x.to===a&&norm(x.fp)===norm(e.tp)&&norm(x.tp)===norm(e.fp))));
      if(!dup){D.edges.push({...e,id:D.edges.some(x=>x.id===e.id)?uid('e'):e.id,from:a,to:b});r.edges++;}});
  });
  (inc.incidents||[]).forEach(i=>{if(S.incidents.some(x=>x.id===i.id))return;const sc=(i.scope||[]).map(x=>({dev:dm[x.dev],port:x.port||''})).filter(x=>x.dev);S.incidents.push({...i,scope:sc});r.inc=(r.inc||0)+1;});

  if(!ui.folder)ui.folder=firstLeaf();

}
/* CSV */
function parseCSV(text){
  text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';
  const delim=[';','\t',','].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===delim){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()));
}
const COLS={name:['nombre','name','hostname','equipo','host','dispositivo'],ip:['ip','direccion ip','ip address','ip gestion','mgmt','ip de gestion'],type:['tipo','type','categoria'],
  brand:['marca','brand','fabricante','vendor'],model:['modelo','model'],access:['acceso','access','protocolo','protocolos'],aport:['puerto acceso','puerto de acceso','puerto gestion','port'],
  location:['ubicacion','sitio','location','site','nodo'],sections:['seccion','red','section','area','secciones'],ports:['puertos','ports','interfaces','interfaz'],notes:['notas','notes','comentarios','observaciones']};
function csvRows(text){
  const rows=parseCSV(text);if(rows.length<2)return{err:'El archivo necesita una fila de encabezados y al menos un equipo.'};
  const head=rows[0].map(fold),idx={};
  Object.entries(COLS).forEach(([k,al])=>{const i=head.findIndex(h=>al.includes(h));if(i>=0)idx[k]=i;});
  if(idx.name==null&&idx.ip==null)return{err:'No encontré columnas de nombre o IP. Revisa los encabezados.'};
  const g=(r,k)=>idx[k]!=null?(r[idx[k]]||'').trim():'';
  const list=rows.slice(1).map(r=>{
    const t=g(r,'type'),type=t?(S.types.find(x=>fold(x.name)===fold(t))?.name||t):'Otro';
    const accTxt=fold(g(r,'access')),aport=g(r,'aport');
    const access=['ssh','telnet','web'].filter(p=>accTxt.includes(p)||(p==='web'&&/http/.test(accTxt))).map(p=>({p,port:aport}));
    const st=fold(g(r,'sections')),sections=[st.includes('voz')||st.includes('voice')?'voz':'',st.includes('trans')?'transporte':'',st.includes('dato')||st.includes('data')?'datos':''].filter(Boolean);
    return{sections,name:g(r,'name')||g(r,'ip'),ip:g(r,'ip'),type,brand:g(r,'brand'),model:g(r,'model'),access,location:g(r,'location'),
      ports:[...new Set(g(r,'ports').split(/[|;,\n]/).map(s=>s.trim()).filter(Boolean))],notes:g(r,'notes')};
  }).filter(d=>d.name);
  return{list,cols:Object.keys(idx)};
}

}
function incSummary(d){const a=incAffect(d);
  const lines=[`${d.title} ${d.ticket?'['+d.ticket+']':''}`.trim(),`Severidad: ${SEV[d.severity]||''} · Causa: ${d.cause||'—'}`,`Inicio: ${fmtDT(d.start)}${d.end?` · Fin: ${fmtDT(d.end)} · Duración: ${fmtDur(d.start,d.end)}`:` · Activa (${fmtDur(d.start)})`}`];
  if(d.vendorTicket)lines.push('Ticket proveedor: '+d.vendorTicket);
  lines.push('Afectación: '+(d.scope.filter(x=>x.dev).map(x=>(devById(x.dev)?.name||'?')+(x.port?' '+x.port:' (todo el equipo)')).join(', ')||'—'));
  lines.push(`Servicios afectados (${a.fids.size}):`);[...a.fids].forEach(f=>lines.push('- '+pathOf(f).map(x=>x.name).join(' › ')));
  if(d.notes)lines.push('Notas: '+d.notes);return lines.join('\n');}
function drawInc(){
  const d=iDraft,body=$('#incBody');if(!body)return;
  const devs=[...S.devices].sort((a,b)=>ncmp(a.name,b.name)),a=incAffect(d);
  const byC={};[...a.fids].forEach(f=>{const c=clientOf(f);(byC[c?.name||'—']=byC[c?.name||'—']||[]).push(pathOf(f).slice(1).map(x=>x.name).join(' › ')||'(cliente)');});
  body.innerHTML=`
    <div class="fld"><span class="lbl">Título</span><input id="iTitle" value="${esc(d.title)}" placeholder="Corte de fibra tramo GPE–Apodaca"></div>
    <div class="three"><div class="fld"><span class="lbl">Ticket de red</span><input id="iTicket" class="mono" value="${esc(d.ticket)}" placeholder="NOC-12345"></div>
      <div class="fld"><span class="lbl">Ticket proveedor</span><input id="iVendor" class="mono" value="${esc(d.vendorTicket||'')}" placeholder="Opcional"></div>
      <div class="fld"><span class="lbl">Severidad</span><select id="iSev">${Object.entries(SEV).map(([k,v])=>`<option value="${k}"${d.severity===k?' selected':''}>${v}</option>`).join('')}</select></div></div>
    <div class="fld"><span class="lbl">Causa</span><input id="iCause" list="dlCause" value="${esc(d.cause)}" placeholder="Elige o escribe"><datalist id="dlCause">${CAUSES.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
    <div class="two"><div class="fld"><span class="lbl">Inicio</span><input type="datetime-local" id="iStart" value="${esc(d.start)}"></div>
      <div class="fld"><span class="lbl">Fin ${d.end?'':'(vacío = activa)'}</span><div style="display:flex;gap:6px"><input type="datetime-local" id="iEnd" value="${esc(d.end)}" style="flex:1;min-width:0">${d.end?'<button class="btn sm" id="iReopen" title="Reabrir">Reabrir</button>':'<button class="btn sm pri" id="iCloseNow">Cerrar ahora</button>'}</div></div></div>
    <div class="fld"><span class="lbl">Equipos y puertos afectados</span><div class="scope">${d.scope.map((sc,k)=>`<div class="scRow"><select data-scd="${k}"><option value="">Equipo…</option>${devs.map(x=>`<option value="${x.id}"${x.id===sc.dev?' selected':''}>${esc(x.name)}</option>`).join('')}</select>
        <select data-scp="${k}" ${sc.dev?'':'disabled'}><option value="">Todo el equipo</option>${sc.dev?devicePorts(sc.dev).map(p=>`<option${norm(p)===norm(sc.port)?' selected':''}>${esc(p)}</option>`).join(''):''}</select>
        <button class="btn ic sm ghost" data-scx="${k}" aria-label="Quitar">✕</button></div>`).join('')}
      <div><button class="btn sm" id="iAddSc">+ Agregar equipo</button></div></div></div>
    <div class="affect"><b>${a.fids.size} servicio${a.fids.size===1?'':'s'} de ${a.clients.size} cliente${a.clients.size===1?'':'s'} afectados</b>${Object.entries(byC).map(([c,l])=>`<span><b style="color:var(--ink)">${esc(c)}</b>: ${l.map(esc).join(', ')}</span>`).join('')}</div>
    <div class="fld" style="margin-top:10px"><span class="lbl">Notas / bitácora</span><textarea id="iNotes" rows="3" placeholder="Avances, contacto con proveedor, cuadrilla…">${esc(d.notes)}</textarea></div>
    <div class="err" id="iErr"></div>`;
  const bind=(id,k)=>{$(id).oninput=e=>{d[k]=e.target.value;};};
  bind('#iTitle','title');bind('#iTicket','ticket');bind('#iVendor','vendorTicket');bind('#iCause','cause');bind('#iNotes','notes');bind('#iStart','start');
  $('#iSev').onchange=e=>d.severity=e.target.value;
  $('#iEnd').onchange=e=>{d.end=e.target.value;drawInc();};
  if($('#iCloseNow'))$('#iCloseNow').onclick=()=>{d.end=localDT();drawInc();};
  if($('#iReopen'))$('#iReopen').onclick=()=>{d.end='';drawInc();};
  body.querySelectorAll('[data-scd]').forEach(el=>el.onchange=()=>{const sc=d.scope[+el.dataset.scd];sc.dev=el.value;sc.port='';drawInc();});
  body.querySelectorAll('[data-scp]').forEach(el=>el.onchange=()=>{d.scope[+el.dataset.scp].port=el.value;drawInc();});
  body.querySelectorAll('[data-scx]').forEach(el=>el.onclick=()=>{d.scope.splice(+el.dataset.scx,1);if(!d.scope.length)d.scope.push({dev:'',port:''});drawInc();});
  $('#iAddSc').onclick=()=>{d.scope.push({dev:'',port:''});drawInc();};
}

function settingsModal(){
  modal('Ajustes',`<div class="fld"><span class="lbl">Tu nombre</span><input id="sOwner" value="${esc(S.meta.owner||'')}" placeholder="Se usa en el nombre del archivo exportado"></div>
    <p class="sub" style="color:var(--muted)">Tu información vive solo en este navegador. Si borras los datos del sitio o cambias de equipo, la recuperas importando tu último JSON exportado.</p>
    <hr class="sep"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" id="sTypes">Tipos de equipo</button><button class="btn dan" id="sWipe">Borrar todo y empezar vacío</button><button class="btn" id="sSample">Cargar datos de ejemplo</button></div>`,
    [{l:'Cerrar'},{l:'Guardar',k:'pri',f:()=>{S.meta.owner=$('#sOwner').value.trim();save(false);closeModal();toast('Ajustes guardados');}}]);
  $('#sWipe').onclick=()=>wipeModal();$('#sTypes').onclick=()=>typesModal();
  $('#sSample').onclick=()=>modal('Cargar ejemplo','<p>Se reemplazará lo que tienes por los datos de ejemplo. Exporta un respaldo antes si lo necesitas.</p>',[{l:'Cancelar'},{l:'Cargar ejemplo',k:'pri',f:()=>{const o=S.meta.owner;S=sample();S.meta.owner=o;ui.folder=firstLeaf();ui.sel=null;ui.impact=null;save(false);closeModal();renderAll();requestAnimationFrame(fit);}}]);
}
function wipeModal(){
  const real=!S.meta.example;
  modal('Empezar vacío',`<p>${real?'Se borrarán <b>todos tus equipos, clientes y diagramas</b> de este navegador. Exporta un respaldo antes si lo necesitas.':'Se quitan los datos de ejemplo para que captures los tuyos.'}</p>`,
    [{l:'Cancelar'},{l:'Borrar',k:'dan pri',f:()=>{const o=S.meta.owner;S=emptyData();S.meta.owner=o;ui.folder=null;ui.sel=null;ui.impact=null;save(false);closeModal();renderAll();}}]);
}

/* ---------- búsqueda global ---------- */
const qI=$('#q'),sres=$('#sres');
function runSearch(){
  const q=fold(qI.value);if(!q){sres.hidden=true;return;}
  const devs=S.devices.filter(d=>fold(d.name+' '+d.ip+' '+d.model+' '+d.location).includes(q)).slice(0,8);
  const fols=S.folders.filter(f=>fold(f.name).includes(q)).slice(0,8);
  const ports=[];S.devices.forEach(d=>devicePorts(d.id).forEach(p=>{if(fold(p)===q||(q.length>=3&&fold(p).includes(q)))ports.push([d,p]);}));
  let h=devs.map(d=>`<button data-sdev="${d.id}"><span class="k">Equipo</span><span>${esc(d.name)}</span><span class="sub">${esc(d.ip)}</span></button>`).join('');
  h+=fols.map(f=>`<button data-open="${f.id}"><span class="k">${esc(KINDS[f.kind])}</span><span>${esc(f.name)}</span><span class="sub" style="font-family:var(--f-ui)">${esc(pathOf(f.id).slice(0,-1).map(x=>x.name).join(' › '))}</span></button>`).join('');
  h+=ports.slice(0,6).map(([d,p])=>`<button data-imp="${d.id}" data-port="${esc(p)}"><span class="k">Puerto</span><span class="mono">${esc(p)}</span><span class="sub">${esc(d.name)}</span></button>`).join('');
  sres.innerHTML=h||'<p style="margin:8px;color:var(--muted)">Sin resultados.</p>';sres.hidden=false;
}
qI.addEventListener('input',runSearch);qI.addEventListener('focus',runSearch);
qI.addEventListener('keydown',e=>{if(e.key==='Escape'){qI.value='';sres.hidden=true;qI.blur();}if(e.key==='Enter'){sres.querySelector('button')?.click();}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search'))sres.hidden=true;});

/* ---------- delegación de clics ---------- */
function openFolder(fid){ui.folder=fid;ui.sel=null;ui.multi=new Set();document.body.classList.remove('showSide');renderAll();requestAnimationFrame(fit);}
function setImpact(dev,port){ui.impact={dev,port:port||''};ui.tab='impacto';renderAll();}
document.addEventListener('click',e=>{
  const t=e.target;
  const tab=t.closest('[data-tab]');if(tab){ui.tab=tab.dataset.tab;renderSide();return;}
  const tog=t.closest('[data-tog]');if(tog){e.stopPropagation();const id=tog.dataset.tog;ui.collapsed.has(id)?ui.collapsed.delete(id):ui.collapsed.add(id);renderSide();return;}
  const ac=t.closest('[data-addchild]');if(ac){const p=folById(ac.dataset.addchild);folderModal(null,p.id,CHILD_KIND[p.kind]);return;}
  const ef=t.closest('[data-editf]');if(ef){folderModal(ef.dataset.editf);return;}
  const ic=t.closest('[data-inc]');if(ic){incModal(ic.dataset.inc);return;}
  const dsc=t.closest('[data-devsec]');if(dsc){ui.devSec=dsc.dataset.devsec;renderSide();return;}
  const gc=t.closest('[data-gcol]');if(gc){const g=getDiag(ui.folder).groups.find(x=>x.id===ui.sel?.id);if(g){g.color=gc.dataset.gcol;save();renderInsp();rc();}return;}
  const icf=t.closest('[data-incf]');if(icf){ui.incFilter=icf.dataset.incf;renderSide();return;}
  const rd=t.closest('[data-rkdev]');if(rd){setImpact(rd.dataset.rkdev,'');return;}
  const rcl=t.closest('[data-rkcli]');if(rcl){openFolder(rcl.dataset.rkcli);return;}
  const imp=t.closest('[data-imp]');if(imp){sres.hidden=true;setImpact(imp.dataset.imp,imp.dataset.port);return;}
  const sd=t.closest('[data-sdev]');if(sd){sres.hidden=true;qI.value='';setImpact(sd.dataset.sdev,'');return;}
  const op=t.closest('[data-open]');if(op){sres.hidden=true;openFolder(op.dataset.open);return;}
  const dv=t.closest('[data-dev]');if(dv){devModal(dv.dataset.dev);return;}
  const sn=t.closest('[data-selnode]');if(sn){const n=getDiag(ui.folder).nodes.find(x=>x.deviceId===sn.dataset.selnode);if(n){ui.multi=new Set([n.id]);ui.sel={t:'node',id:n.id};renderInsp();rc();}return;}
  const cp=t.closest('[data-copy]');if(cp){copyText(cp.dataset.copy);return;}
  const a=t.closest('[data-act]');if(!a)return;
  const D=ui.folder&&getDiag(ui.folder);
  switch(a.dataset.act){
    case 'newClient':folderModal(null,null,'cliente');break;
    case 'newDev':ui.addAfterCreate=false;ui.addFrom=null;devModal(null);break;
    case 'csv':csvModal();break;
    case 'newInc':incModal(null);break;
    case 'addDev':ui.addFrom=null;pickDevModal();break;
    case 'plusDev':$('#plusMenu').hidden=true;ui.addFrom=ui.plusNode;pickDevModal();break;
    case 'plusTxt':{$('#plusMenu').hidden=true;const D=getDiag(ui.folder),n=D.nodes.find(x=>x.id===ui.plusNode);if(!n)break;const G=geom(n);
      const t={id:uid('t'),text:'Nota',x:n.x,y:n.y+G.h+18};D.nodes.push(t);ui.multi=new Set([t.id]);ui.sel={t:'node',id:t.id};save();renderAll();setTimeout(()=>{const i=$('#nTxt');if(i){i.focus();i.select();}},30);break;}
    case 'plusGrp':$('#plusMenu').hidden=true;groupFromSelection('edificio');break;
    case 'addTxt':addText();break;
    case 'addGrp':groupFromSelection('edificio');break;
    case 'mkGroup':groupFromSelection($('#mKind').value);break;
    case 'incFromImp':incModal(null,[{dev:ui.impact.dev,port:ui.impact.port||''}]);break;
    case 'incFromNode':incModal(null,[{dev:a.dataset.devid,port:''}]);break;
    case 'types':typesModal();break;
    case 'wipe':wipeModal();break;
    case 'clearImp':ui.impact=null;renderAll();break;
    case 'showImp':ui.tab='impacto';document.body.classList.add('showSide');renderSide();break;
    case 'desel':ui.sel=null;ui.multi=new Set();renderInsp();rc();break;
    case 'flip':{const ed=D.edges.find(x=>x.id===ui.sel.id);[ed.from,ed.to,ed.fp,ed.tp]=[ed.to,ed.from,ed.tp,ed.fp];save();renderInsp();rc();break;}
    case 'delSel':delSel();break;
    case 'copyImp':{const items=impactOf(ui.impact.dev,ui.impact.port),d=devById(ui.impact.dev);
      const txt=`Impacto ${d.name} (${d.ip})${ui.impact.port?' puerto '+ui.impact.port:''}: ${items.length} servicios\n`+items.map(i=>'- '+pathOf(i.fid).map(f=>f.name).join(' › ')+(i.ports.length?` [${i.ports.join(', ')}]`:'')).join('\n');
      copyText(txt);break;}
  }
});
$('#pane').addEventListener('input',e=>{if(e.target.id==='incQ'){ui.incQ=e.target.value;const p=e.target.selectionStart;renderSide();const i=$('#incQ');i.focus();i.setSelectionRange(p,p);return;}if(e.target.id==='devQ'){ui.devQ=e.target.value;const p=e.target.selectionStart;renderSide();const i=$('#devQ');i.focus();i.setSelectionRange(p,p);}});
$('#pane').addEventListener('change',e=>{
  if(e.target.id==='incPer'){S.meta.incPeriod=e.target.value;save(false);renderAll();return;}
  if(e.target.id==='impDev'){ui.impact=e.target.value?{dev:e.target.value,port:''}:null;renderAll();}
  if(e.target.id==='impPort'){ui.impact.port=e.target.value;renderAll();}
});
function delSel(){
  const D=getDiag(ui.folder);if(!ui.sel)return;
  if(ui.sel.t==='group'){D.groups=D.groups.filter(g=>g.id!==ui.sel.id);ui.sel=null;save();renderAll();return;}
  if(ui.sel.t==='multi'){const ids=ui.multi||new Set();D.nodes=D.nodes.filter(n=>!ids.has(n.id));D.edges=D.edges.filter(e=>!ids.has(e.from)&&!ids.has(e.to));ui.multi=new Set();ui.sel=null;save();renderAll();return;}
  if(ui.sel.t==='node'){D.nodes=D.nodes.filter(n=>n.id!==ui.sel.id);D.edges=D.edges.filter(e=>e.from!==ui.sel.id&&e.to!==ui.sel.id);}
  else D.edges=D.edges.filter(e=>e.id!==ui.sel.id);
  ui.sel=null;save();renderAll();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(ui.sel){ui.sel=null;ui.multi=new Set();renderInsp();rc();}document.body.classList.remove('showSide');}
  if((e.key==='Delete'||e.key==='Backspace')&&ui.sel&&!e.target.closest('input,textarea,select')&&$('#modal').hidden){e.preventDefault();delSel();}
});
$('#bExport').onclick=exportJSON;$('#bImport').onclick=importModal;$('#bSettings').onclick=settingsModal;
$('#menuBtn').onclick=()=>document.body.classList.toggle('showSide');
$('#scrim').onclick=()=>document.body.classList.remove('showSide');
window.addEventListener('resize',()=>rc());

function renderAll(){renderSide();renderCanvas();renderInsp();renderStatus();}
renderAll();
requestAnimationFrame(()=>requestAnimationFrame(fit));
</script>

</body>
</html>
