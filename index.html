/* ---------- incidencias ---------- */
const SEV={critica:'Crítica',mayor:'Mayor',menor:'Menor'};
const CAUSES=['Corte de fibra','Falla eléctrica','Falla de equipo','Mantenimiento','Configuración','Saturación','Proveedor / upstream','Clima','Vandalismo / robo','Otro'];
const PERIODS={'30':'30 días','90':'90 días','365':'12 meses','all':'Todo'};
const activeIncs=()=>(S.incidents||[]).filter(i=>!i.end);
function periodIncs(){const p=S.meta.incPeriod||'90';if(p==='all')return S.incidents||[];const lim=Date.now()-(+p)*86400000;return (S.incidents||[]).filter(i=>{const d=parseDT(i.start);return d&&d.getTime()>=lim;});}
function incAffect(inc){const fids=new Set(),clients=new Set();(inc.scope||[]).forEach(sc=>{if(!sc.dev)return;impactOf(sc.dev,sc.port).forEach(it=>{fids.add(it.fid);const c=clientOf(it.fid);if(c)clients.add(c.id);});});return{fids,clients};}
function incHits(fid,list){
  const nodes=new Map(),edges=new Set(),hl=[];
  list.forEach(inc=>{let any=false;(inc.scope||[]).forEach(sc=>{if(!sc.dev)return;const it=fid===MAP?diagHits(getDiag(MAP),sc.dev,sc.port):impactOf(sc.dev,sc.port).find(i=>i.fid===fid);if(!it)return;any=true;
    it.nodes.forEach(n=>{if(!nodes.has(n))nodes.set(n,new Set());nodes.get(n).add(inc.id);});it.edges.forEach(e=>edges.add(e));});if(any)hl.push(inc);});
  return{nodes,edges,list:hl};
}
function incCard(i){const a=incAffect(i),act=!i.end;
  return `<button class="icard${act?' act':''}" data-inc="${i.id}"><span class="ih"><span class="sev ${i.severity}">${SEV[i.severity]||''}</span>${act?`Activa · ${fmtDur(i.start)}`:`${fmtDT(i.start)} · duró ${fmtDur(i.start,i.end)}`}</span>
    <b>${esc(i.title||'(sin título)')}</b>${i.ticket||i.cause?`<span class="it">${esc([i.ticket,i.cause].filter(Boolean).join(' · '))}</span>`:''}
    <span class="ia">${a.fids.size} servicio${a.fids.size===1?'':'s'} · ${a.clients.size} cliente${a.clients.size===1?'':'s'}</span></button>`;}
function sideIncidents(){
  const f=ui.incFilter||'activas',q=fold(ui.incQ||'');
  let list=[...(S.incidents||[])].filter(i=>f==='todas'||(f==='activas'?!i.end:!!i.end))
    .filter(i=>!q||fold([i.title,i.ticket,i.vendorTicket,i.cause,i.notes].join(' ')).includes(q))
    .sort((a,b)=>(!a.end-!b.end)*-1||String(b.start).localeCompare(String(a.start)));
  const na=activeIncs().length;
  // ranking
  const per=S.meta.incPeriod||'90',pl=periodIncs(),dc={},cc={};
  pl.forEach(i=>{const ds=new Set((i.scope||[]).map(x=>x.dev).filter(Boolean));ds.forEach(d=>dc[d]=(dc[d]||0)+1);incAffect(i).clients.forEach(c=>cc[c]=(cc[c]||0)+1);});
  const rk=(obj,nameOf,attr)=>{const arr=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=arr[0]?.[1]||1;
    return arr.length?`<div class="rank">${arr.map(([id,n])=>`<button ${attr}="${id}"><span class="nm">${esc(nameOf(id))}</span><span class="bar"><i style="width:${n/mx*100}%"></i></span><span class="n">${n}</span></button>`).join('')}</div>`:'<p class="sub" style="color:var(--muted);margin:0">Sin incidencias en este periodo.</p>';};
  return `<div class="paneHead"><span class="lbl grow">${na} activa${na===1?'':'s'}</span><button class="btn sm dan" data-act="newInc">+ Incidencia</button></div>
   <div class="seg">${['activas','cerradas','todas'].map(k=>`<button data-incf="${k}" class="${f===k?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>
   <input class="inp" id="incQ" type="search" placeholder="Buscar por ticket, título, causa…" style="margin-bottom:8px">
   <div class="ilist">${list.map(incCard).join('')||`<p class="sub" style="color:var(--muted)">${f==='activas'?'No hay incidencias activas.':'Sin incidencias.'}</p>`}</div>
   <hr class="sep" style="margin:14px 0 10px">
   <div class="paneHead"><span class="lbl grow">Más afectados</span><select class="layerSel" id="incPer">${Object.entries(PERIODS).map(([k,v])=>`<option value="${k}"${k===per?' selected':''}>${v}</option>`).join('')}</select></div>
   <p class="sub" style="color:var(--muted);margin:0 0 6px;font-size:12px">${pl.length} incidencia${pl.length===1?'':'s'} en el periodo. Activa la capa <b>historial</b> en el diagrama para ver dónde se concentran.</p>
   <span class="lbl">Equipos</span>${rk(dc,id=>devById(id)?.name||'(eliminado)','data-rkdev')}
   <span class="lbl" style="display:block;margin-top:10px">Clientes</span>${rk(cc,id=>folById(id)?.name||'(eliminado)','data-rkcli')}`;
}
let iDraft=null;
function incModal(id,prefill){
  const ex=id?S.incidents.find(x=>x.id===id):null;
  iDraft=ex?JSON.parse(JSON.stringify(ex)):{id:uid('i'),title:'',ticket:'',vendorTicket:'',cause:'',severity:'mayor',start:localDT(),end:'',notes:'',scope:prefill||[{dev:'',port:''}]};
  if(!iDraft.scope.length)iDraft.scope=[{dev:'',port:''}];
  modal(ex?'Incidencia':'Nueva incidencia','<div id="incBody"></div>',[
    ...(ex?[{l:'Eliminar',k:'dan',f:()=>modal('Eliminar incidencia','<p>Se borra del historial y deja de contar en las estadísticas.</p>',[{l:'Cancelar',f:()=>incModal(id)},{l:'Eliminar',k:'dan pri',f:()=>{S.incidents=S.incidents.filter(x=>x.id!==id);save();closeModal();renderAll();toast('Incidencia eliminada');}}])}]:[]),
    {l:'Copiar resumen',f:()=>copyText(incSummary(iDraft))},
    {l:'Cancelar'},
    {l:'Guardar',k:'pri',f:()=>{
      const d=iDraft,err=$('#iErr');
      if(!d.title.trim())d.title=autoIncTitle(d);
      if(!d.start){err.textContent='Indica la fecha y hora de inicio.';return;}
      if(d.end&&parseDT(d.end)<parseDT(d.start)){err.textContent='La hora de fin es anterior al inicio.';return;}
      d.scope=d.scope.filter(x=>x.dev);
      const i=S.incidents.findIndex(x=>x.id===d.id);if(i>=0)S.incidents[i]=d;else S.incidents.push(d);
      save();closeModal();renderAll();toast(d.end?'Incidencia guardada como cerrada':'Incidencia activa guardada');}}]);
  drawInc();
}
function autoIncTitle(d){const devs=(d.scope||[]).filter(x=>x.dev).map(x=>(devById(x.dev)?.name||'')+(x.port?' '+x.port:'')).filter(Boolean);
  return [d.cause||'Incidencia',devs.slice(0,2).join(', ')+(devs.length>2?` +${devs.length-2}`:'')].filter(Boolean).join(' · ')+(d.ticket?` (${d.ticket})`:'');}
function incSummary(d){const a=incAffect(d);
  const lines=[`${d.title} ${d.ticket?'['+d.ticket+']':''}`.trim(),`Severidad: ${SEV[d.severity]||''} · Causa: ${d.cause||'—'}`,`Inicio: ${fmtDT(d.start)}${d.end?` · Fin: ${fmtDT(d.end)} · Duración: ${fmtDur(d.start,d.end)}`:` · Activa (${fmtDur(d.start)})`}`];
  if(d.vendorTicket)lines.push('Ticket proveedor: '+d.vendorTicket);
  lines.push('Afectación: '+(d.scope.filter(x=>x.dev).map(x=>(devById(x.dev)?.name||'?')+(x.port?' '+x.port:' (todo el equipo)')).join(', ')||'—'));
  lines.push(`Servicios afectados (${a.fids.size}):`);[...a.fids].forEach(f=>lines.push('- '+pathOf(f).map(x=>x.name).join(' › ')));
  if(d.notes)lines.push('Notas: '+d.notes);return lines.join('\n');}
function drawInc(){

  body.innerHTML=`
    <div class="fld"><span class="lbl">Título (opcional)</span><input id="iTitle" value="${esc(d.title)}" placeholder="Si lo dejas vacío: ${esc(autoIncTitle(d))}"></div>
    <div class="three"><div class="fld"><span class="lbl">Ticket de red</span><input id="iTicket" class="mono" value="${esc(d.ticket)}" placeholder="NOC-12345"></div>
      <div class="fld"><span class="lbl">Ticket proveedor</span><input id="iVendor" class="mono" value="${esc(d.vendorTicket||'')}" placeholder="Opcional"></div>
      <div class="fld"><span class="lbl">Severidad</span><select id="iSev">${Object.entries(SEV).map(([k,v])=>`<option value="${k}"${d.severity===k?' selected':''}>${v}</option>`).join('')}</select></div></div>
    <div class="fld"><span class="lbl">Causa</span><input id="iCause" list="dlCause" value="${esc(d.cause)}" placeholder="Elige o escribe"><datalist id="dlCause">${CAUSES.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
    <div class="two"><div class="fld"><span class="lbl">Inicio</span><input type="datetime-local" id="iStart" value="${esc(d.start)}"></div>
      <div class="fld"><span class="lbl">Fin ${d.end?'':'(vacío = activa)'}</span><div style="display:flex;gap:6px"><input type="datetime-local" id="iEnd" value="${esc(d.end)}" style="flex:1;min-width:0">${d.end?'<button class="btn sm" id="iReopen" title="Reabrir">Reabrir</button>':'<button class="btn sm pri" id="iCloseNow">Cerrar ahora</button>'}</div></div></div>
    <div class="fld"><span class="lbl">Equipos y puertos afectados</span><div class="scope">${d.scope.map((sc,k)=>`<div class="scRow"><select data-scd="${k}"><option value="">Equipo…</option>${devs.map(x=>`<option value="${x.id}"${x.id===sc.dev?' selected':''}>${esc(x.name)}</option>`).join('')}</select>
        <select data-scp="${k}" ${sc.dev?'':'disabled'}><option value="">Todo el equipo</option>${sc.dev?devicePorts(sc.dev).map(p=>`<option${norm(p)===norm(sc.port)?' selected':''}>${esc(p)}</option>`).join(''):''}</select>
        <button class="btn ic sm ghost" data-scx="${k}" aria-label="Quitar">✕</button></div>`).join('')}
      <div><button class="btn sm" id="iAddSc">+ Agregar equipo</button></div></div></div>
    <div class="affect"><b>${a.fids.size} servicio${a.fids.size===1?'':'s'} de ${a.clients.size} cliente${a.clients.size===1?'':'s'} afectados</b>${Object.entries(byC).map(([c,l])=>`<span><b style="color:var(--ink)">${esc(c)}</b>: ${l.map(esc).join(', ')}</span>`).join('')}</div>

const qI=$('#q'),sres=$('#sres');
function runSearch(){
  const q=fold(qI.value);if(!q){sres.hidden=true;return;}
  const devs=S.devices.filter(d=>fold(d.name+' '+d.ip+' '+d.model+' '+d.location).includes(q)).slice(0,8);
  const fols=S.folders.filter(f=>fold(f.name).includes(q)).slice(0,8);
  const ports=[];S.devices.forEach(d=>devicePorts(d.id).forEach(p=>{if(fold(p)===q||(q.length>=3&&fold(p).includes(q)))ports.push([d,p]);}));
  let h=devs.map(d=>`<button data-sdev="${d.id}"><span class="k">Equipo</span><span>${esc(d.name)}</span><span class="sub">${esc(d.ip)}</span></button>`).join('');
  h+=fols.map(f=>`<button data-open="${f.id}"><span class="k">${esc(KINDS[f.kind])}</span><span>${esc(f.name)}</span><span class="sub" style="font-family:var(--f-ui)">${esc(pathOf(f.id).slice(0,-1).map(x=>x.name).join(' › '))}</span></button>`).join('');
  h+=ports.slice(0,6).map(([d,p])=>`<button data-imp="${d.id}" data-port="${esc(p)}"><span class="k">Puerto</span><span class="mono">${esc(p)}</span><span class="sub">${esc(d.name)}</span></button>`).join('');
  sres.innerHTML=h||'<p style="margin:8px;color:var(--muted)">Sin resultados.</p>';sres.hidden=false;
}
qI.addEventListener('input',runSearch);qI.addEventListener('focus',runSearch);
qI.addEventListener('keydown',e=>{if(e.key==='Escape'){qI.value='';sres.hidden=true;qI.blur();}if(e.key==='Enter'){sres.querySelector('button')?.click();}});

  if(e.target.matches('[data-mapf]')){const all=diagFids(),sel=new Set(mapSel()),ds=subtree(e.target.dataset.mapf).filter(x=>all.includes(x));
    if(e.target.checked)ds.forEach(x=>sel.add(x));else ds.forEach(x=>sel.delete(x));S.meta.mapSel=[...sel];save(false);refreshMap(false);return;}
  if(e.target.id==='mapLoc'){S.meta.mapLoc=e.target.checked;save(false);refreshMap(false);return;}
  if(e.target.id==='mapShared'){S.meta.mapShared=e.target.checked;save(false);rc();return;}
  if(e.target.id==='incPer'){S.meta.incPeriod=e.target.value;save(false);renderAll();return;}
  if(e.target.id==='impDev'){ui.impact=e.target.value?{dev:e.target.value,port:''}:null;renderAll();}
  if(e.target.id==='impPort'){ui.impact.port=e.target.value;renderAll();}
});
function delSel(){
  if(ui.folder===MAP){toast('El mapa general es de solo lectura; edita en el diagrama de cada servicio');return;}
  const D=getDiag(ui.folder);if(!ui.sel)return;
  if(ui.sel.t==='group'){D.groups=D.groups.filter(g=>g.id!==ui.sel.id);ui.sel=null;save();renderAll();return;}
  if(ui.sel.t==='multi'){const ids=ui.multi||new Set();D.nodes=D.nodes.filter(n=>!ids.has(n.id));D.edges=D.edges.filter(e=>!ids.has(e.from)&&!ids.has(e.to));ui.multi=new Set();ui.sel=null;save();renderAll();return;}
  if(ui.sel.t==='node'){D.nodes=D.nodes.filter(n=>n.id!==ui.sel.id);D.edges=D.edges.filter(e=>e.from!==ui.sel.id&&e.to!==ui.sel.id);}
  else D.edges=D.edges.filter(e=>e.id!==ui.sel.id);
  ui.sel=null;save();renderAll();
}
$('#impMini').onclick=()=>{ui.impMin=false;rc();};
$('#bUndo').onclick=()=>undoApply(-1);$('#bRedo').onclick=()=>undoApply(1);
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&!e.target.closest('input,textarea,select,[contenteditable]')&&$('#modal').hidden){const k=e.key.toLowerCase();
    if(k==='c'&&ui.view==='diagram'&&ui.folder&&ui.folder!==MAP&&!window.getSelection()?.toString()){if(copyNodes()){e.preventDefault();return;}}
    if(k==='v'&&ui.view==='diagram'&&ui.folder&&ui.folder!==MAP&&ui.clip){e.preventDefault();pasteNodes();return;}
    if(k==='z'&&!e.shiftKey){e.preventDefault();undoApply(-1);return;}if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();undoApply(1);return;}}
  if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(ui.sel){ui.sel=null;ui.multi=new Set();renderInsp();rc();}document.body.classList.remove('showSide');}
  if((e.key==='Delete'||e.key==='Backspace')&&ui.sel&&!e.target.closest('input,textarea,select')&&$('#modal').hidden){e.preventDefault();delSel();}
});

$('#cardsView').addEventListener('input',e=>{if(e.target.id==='cvQ'){ui.cvQ=e.target.value;ui.cvFocus=true;renderView();}});
$('#cardsView').addEventListener('change',e=>{if(e.target.id==='devIncOnly'){ui.devInc=e.target.checked;renderView();return;}if(e.target.dataset.dt)dtCommit(e.target);else if(e.target.dataset.dtlv)lvCommit(e.target);});
$('#cardsView').addEventListener('focusin',e=>{const t=e.target;if(!t.dataset||!t.dataset.dtlv)return;const d=devById(t.closest('[data-drow]').dataset.drow);const dl=$('#dtDL');if(!dl||!d)return;dl.innerHTML=lvOptions(d,t.dataset.dtlv);t.setAttribute('list','dtDL');});
$('#cardsView').addEventListener('keydown',e=>{const t=e.target;if(!t.dataset||!(t.dataset.dt||t.dataset.dtlv))return;
  if(e.key==='Escape'){const d=devById(t.closest('[data-drow]').dataset.drow);const k=t.dataset.dt;t.value=t.dataset.dtlv?(placeChain(d.place).find(x=>x.kind===t.dataset.dtlv)?.name||''):k==='access'?accStr(d):k==='ports'?(d.ports||[]).join(', '):(d[k]||'');t.blur();return;}
  if(e.key==='Enter'&&t.tagName==='INPUT'){e.preventDefault();const td=t.closest('td'),ci=[...td.parentNode.children].indexOf(td),nx=t.closest('tr').nextElementSibling;const n=nx&&nx.children[ci]&&nx.children[ci].querySelector('.c');t.blur();if(n)n.focus();}});
$('#cardsView').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-cpage],[data-dcard],.svrow')){e.preventDefault();e.target.click();}});

$('#scrim').onclick=()=>document.body.classList.remove('showSide');

/* ---------- paneles laterales: ocultar y ancho ---------- */
const desk=()=>matchMedia('(min-width:861px)').matches;
function applyPanels(){
  const app=$('#app'),m=S.meta;
  document.body.classList.toggle('hideL',!!m.hideL&&desk());document.body.classList.toggle('hideR',!!m.hideR&&desk());
  $('#togL').classList.toggle('off',!!m.hideL);$('#togR').classList.toggle('off',!!m.hideR);
  $('#togL').title=m.hideL?'Mostrar el panel de clientes':'Ocultar el panel de clientes';$('#togR').title=m.hideR?'Mostrar el panel de detalle':'Ocultar el panel de detalle';
  if(!desk()){app.style.gridTemplateColumns='';app.style.columnGap='';return;}
  const def=innerWidth<=1100?[260,270]:[290,300];
  const lw=m.hideL?0:(m.lw||def[0]),rw=m.hideR?0:(m.rw||def[1]);
  app.style.columnGap='0px';
  app.style.gridTemplateColumns=`${lw}px ${m.hideL?0:10}px minmax(0,1fr) ${m.hideR?0:10}px ${rw}px`;
  rc();
}
$('#togL').onclick=()=>{if(!desk()){document.body.classList.toggle('showSide');return;}S.meta.hideL=!S.meta.hideL;save(false);applyPanels();setTimeout(()=>rc(),30);};
$('#togR').onclick=()=>{if(!desk()){ui.sel=null;renderInsp();return;}S.meta.hideR=!S.meta.hideR;save(false);applyPanels();setTimeout(()=>rc(),30);};
document.querySelectorAll('[data-rz]').forEach(el=>{
  el.addEventListener('pointerdown',e=>{if(!desk())return;e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add('on');document.body.classList.add('resizing');
    const side=el.dataset.rz,r=$('#app').getBoundingClientRect(),cs=getComputedStyle($('#app'));
    const mv=ev=>{let w;if(side==='L')w=ev.clientX-r.left-parseFloat(cs.paddingLeft)-5;else w=r.right-parseFloat(cs.paddingRight)-ev.clientX-5;
      const max=Math.min(side==='L'?620:680,r.width-520);w=Math.round(Math.max(side==='L'?200:220,Math.min(max,w)));
      if(side==='L')S.meta.lw=w;else S.meta.rw=w;applyPanels();};
    const up=()=>{el.releasePointerCapture(e.pointerId);el.classList.remove('on');document.body.classList.remove('resizing');el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);save(false);rc();};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);});
  el.addEventListener('dblclick',()=>{if(el.dataset.rz==='L')delete S.meta.lw;else delete S.meta.rw;save(false);applyPanels();});
});
window.addEventListener('resize',()=>{applyPanels();rc();if(ui.view==='clients'&&ui.cliPage)drawL2L();});

function renderAll(){renderView();if(ui.folder===MAP&&!ui.mapLock){ui.mapLock=1;ui.mapD=buildMap();ui.mapLock=0;}renderSide();renderCanvas();renderInsp();renderStatus();}
S_READY=true;setTimeout(()=>{UNDO.last=JSON.stringify(S);undoBtns();},0);try{if(S.meta.autoLoc===false&&!S.meta.locHide)S.meta.locHide=[...PKINDS];delete S.meta.autoLoc;migratePlaces(S);migrateSitio(S);}catch(e){console.error(e);}
renderAll();applyPanels();
requestAnimationFrame(()=>requestAnimationFrame(fit));
